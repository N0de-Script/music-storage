<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N0DE SOUNDS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
    }

    /* 1. 배경 비디오 레이어 */
    .bg-video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
    }

    .bg-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(30px) brightness(0.5);
      transform: scale(1.15);
    }

    /* 2. 어두운 오버레이 레이어 */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.4);
      z-index: 2;
    }

    /* 3. 중앙 플레이어 카드 */
    .player-container {
      position: relative;
      z-index: 3;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .now-playing { text-align: center; margin-bottom: 20px; }
    
    .album-art {
      width: 100%;
      height: 180px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .song-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .artist { font-size: 14px; color: #cbd5e1; margin-bottom: 16px; }

    audio {
      width: 100%;
      margin-bottom: 20px;
      filter: invert(0.9) hue-rotate(180deg);
    }

    .playlist-title {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .playlist {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.6);
    }

    .playlist-item {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .playlist-item:last-child { border-bottom: none; }
    .playlist-item:hover { background: rgba(255, 255, 255, 0.1); }
    .playlist-item.active {
      background: rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 새로 올려주신 mp4 파일 연결 -->
  <div class="bg-video-container">
    <video id="bg-video" src="https://n0de-script.github.io/mp4-storage/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20(2).mp4" autoplay loop muted playsinline></video>
  </div>
  <div class="overlay"></div>

  <!-- 음악 플레이어 -->
  <div class="player-container">
    <div class="now-playing">
      <div class="album-art">🎧</div>
      <div class="song-title" id="current-title">곡을 선택해주세요</div>
      <div class="artist" id="current-artist">N0DE SOUNDS</div>
      <audio id="audio-player" controls></audio>
    </div>

    <div class="playlist-title">Playlist</div>
    <ul class="playlist" id="playlist"></ul>
  </div>

  <script>
    const songs = [
      { title: "midwxst - i told u v1", artist: "midwxst", audioSrc: "1.mp3" },
      { title: "Nightcore - BrooklynBloodPop!", artist: "SyKo", audioSrc: "2.mp3" },
      { title: "NUMBER TWERKNATION28", artist: "Artist", audioSrc: "3.mp3" },
      { title: "ycs - 너", artist: "ycs", audioSrc: "4.mp3" },
      { title: "이상형 - relations", artist: "이상형", audioSrc: "5.mp3" }
    ];

    const audioPlayer = document.getElementById('audio-player');
    const bgVideo = document.getElementById('bg-video');
    const currentTitle = document.getElementById('current-title');
    const currentArtist = document.getElementById('current-artist');
    const playlistElement = document.getElementById('playlist');

    let currentIndex = 0;

    function renderPlaylist() {
      playlistElement.innerHTML = '';
      songs.forEach((song, index) => {
        const li = document.createElement('li');
        li.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        li.innerHTML = `<span>▶</span> <span>${song.title}</span>`;
        li.addEventListener('click', () => loadSong(index, true));
        playlistElement.appendChild(li);
      });
    }

    function loadSong(index, shouldPlay = false) {
      currentIndex = index;
      const song = songs[currentIndex];

      currentTitle.textContent = song.title;
      currentArtist.textContent = song.artist;
      audioPlayer.src = song.audioSrc;

      renderPlaylist();

      if (shouldPlay) {
        audioPlayer.play();
        bgVideo.play().catch(() => {});
      }
    }

    // 첫 클릭 시 배경 영상 재생 (자동재생 보안 차단 방지)
    document.body.addEventListener('click', () => {
      bgVideo.play().catch(() => {});
    }, { once: true });

    audioPlayer.addEventListener('play', () => bgVideo.play().catch(() => {}));
    audioPlayer.addEventListener('pause', () => bgVideo.pause());

    audioPlayer.addEventListener('timeupdate', () => {
      if (Math.abs(bgVideo.currentTime - audioPlayer.currentTime) > 0.5) {
        bgVideo.currentTime = audioPlayer.currentTime;
      }
    });

    audioPlayer.addEventListener('ended', () => {
      currentIndex = (currentIndex + 1) % songs.length;
      loadSong(currentIndex, true);
    });

    loadSong(0);
  </script>

</body>
</html>
