<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N0DE SOUNDS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
    background:#10131a;color:#fff;min-height:100vh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
}
#videoBackground{
    position:fixed;inset:0;width:100vw;height:100vh;z-index:0;overflow:hidden;
    background:#10131a;opacity:0;visibility:hidden;
    transition:opacity .6s cubic-bezier(.22,1,.36,1),visibility .6s ease;
    pointer-events:none;
}
#videoBackground.show{opacity:1;visibility:visible}
.background-video,.background-image{
    position:absolute;inset:-1%;width:102%;height:102%;
    object-fit:cover;background-position:center;background-size:cover;background-repeat:no-repeat;
    filter:brightness(.72) saturate(1.08) contrast(1.03);
    transform:scale(1.005);opacity:0;
    transition:opacity .6s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
}
.background-video.active,.background-image.active{opacity:1}
#videoOverlay{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:rgba(0,0,0,.08);
}
.player-wrapper{
    position:relative;z-index:10;width:min(430px,calc(100% - 30px));
    transition:transform .65s cubic-bezier(.22,1,.36,1),opacity .45s ease;
}
.player{
    position:relative;overflow:hidden;isolation:isolate;
    width:100%;padding:22px;border-radius:30px;
    background:rgba(245,245,247,.14);
    border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.42),
        inset 0 -1px 0 rgba(255,255,255,.07),
        0 24px 70px rgba(0,0,0,.38);
}
.player::before{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(135deg,rgba(255,255,255,.17),transparent 32%,transparent 68%,rgba(255,255,255,.05));
}
.player::after{
    content:"";position:absolute;top:-70%;left:-45%;width:30%;height:240%;
    transform:rotate(20deg);pointer-events:none;opacity:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);
    transition:left .75s cubic-bezier(.22,1,.36,1),opacity .25s ease;
}
.player:hover::after{left:125%;opacity:1}
.player-wrapper.closed{transform:translateY(35px) scale(.86);opacity:0;pointer-events:none}
.top-bar{position:relative;z-index:5;display:flex;justify-content:flex-end;margin-bottom:8px}
.glass-button,.search-button,.open-player{
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.12);color:#fff;cursor:pointer;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 7px 20px rgba(0,0,0,.18);
    transition:transform .22s cubic-bezier(.22,1,.36,1),background .22s ease,box-shadow .22s ease;
}
.glass-button::before,.search-button::before,.open-player::before{
    content:"";position:absolute;top:-100%;left:-80%;width:45%;height:300%;
    transform:rotate(20deg);pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
    transition:left .55s cubic-bezier(.22,1,.36,1);
}
.glass-button:hover,.search-button:hover,.open-player:hover{
    background:rgba(255,255,255,.19);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 28px rgba(0,0,0,.23);
    transform:scale(1.05);
}
.glass-button:hover::before,.search-button:hover::before,.open-player:hover::before{left:145%}
.glass-button:active,.search-button:active,.open-player:active{
    transform:scale(.88);
    background:rgba(255,255,255,.1);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.2);
    transition:transform .07s ease,background .07s ease;
}
.glass-button{width:38px;height:38px;border-radius:50%;font-size:19px;line-height:1}
.title{
    position:relative;z-index:4;text-align:center;font-size:20px;font-weight:700;
    line-height:1.4;word-break:break-word;text-shadow:0 2px 10px rgba(0,0,0,.25);
}
.artist{
    position:relative;z-index:4;text-align:center;margin-top:5px;margin-bottom:18px;
    color:rgba(255,255,255,.62);font-size:14px;
}
audio{position:relative;z-index:4;width:100%;margin-bottom:22px;border-radius:18px;opacity:.92}
.playlist-header{
    position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px
}
.playlist-title{font-size:12px;color:rgba(255,255,255,.55);font-weight:700;letter-spacing:.08em}
.search-button{width:34px;height:34px;border-radius:50%;font-size:14px;padding:0}
.search-container{
    position:relative;z-index:4;max-height:0;opacity:0;overflow:hidden;
    transform:translateY(-8px) scale(.97);margin-bottom:0;
    transition:max-height .45s cubic-bezier(.22,1,.36,1),opacity .3s ease,
               transform .45s cubic-bezier(.22,1,.36,1),margin-bottom .45s ease;
}
.search-container.open{max-height:70px;opacity:1;transform:none;margin-bottom:10px}
.search-box{
    width:100%;height:42px;border-radius:16px;border:1px solid rgba(255,255,255,.2);
    outline:none;padding:0 15px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
    transition:background .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.search-box:hover{background:rgba(255,255,255,.13)}
.search-box:focus{
    background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.36);
    box-shadow:0 0 0 3px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.28)
}
.search-box::placeholder{color:rgba(255,255,255,.42)}
.playlist-wrapper{
    position:relative;z-index:4;overflow:hidden;max-height:230px;opacity:1;
    transform:none;transition:max-height .55s cubic-bezier(.22,1,.36,1),opacity .35s ease,transform .55s ease;
}
.playlist-wrapper.closed{max-height:0;opacity:0;transform:translateY(-10px)}
.playlist{
    list-style:none;max-height:210px;overflow-y:auto;border-radius:18px;
    background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.1);scrollbar-width:thin
}
.playlist::-webkit-scrollbar{width:5px}
.playlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:20px}
.song{
    position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;
    padding:13px 15px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);
    transition:background .22s ease,transform .12s cubic-bezier(.22,1,.36,1)
}
.song::before{
    content:"";position:absolute;top:-100%;left:-80%;width:42%;height:300%;
    transform:rotate(20deg);pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);
    transition:left .55s cubic-bezier(.22,1,.36,1)
}
.song:hover{background:rgba(255,255,255,.08)}
.song:hover::before{left:145%}
.song:active{transform:scale(.975);background:rgba(255,255,255,.13)}
.song:last-child{border-bottom:none}
.song.active{
    background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(255,255,255,.07));
    box-shadow:inset 3px 0 0 rgba(255,255,255,.72)
}
.number{width:22px;min-width:22px;text-align:center;color:rgba(255,255,255,.45);font-size:12px}
.song-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.open-player{
    position:fixed;z-index:20;left:50%;bottom:25px;width:52px;height:52px;border-radius:50%;
    font-size:21px;padding:0;opacity:0;pointer-events:none;transform:translateX(-50%) scale(.75)
}
.open-player.show{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
@media(max-width:500px){
    .player-wrapper{width:calc(100% - 20px)}
    .player{padding:18px;border-radius:27px}
    .title{font-size:18px}
    .open-player{bottom:18px}
}
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>


<body>


<!-- ==========================================
     배경
========================================== -->

<div id="videoBackground">


    <!-- 1번 BrooklynBloodPop! GIF 배경 -->

    <div
        id="backgroundImage1"
        class="background-image">
    </div>


    <!-- 2번 i told u v1 영상 배경 -->

    <video
        id="backgroundVideo1"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20(2).mp4">
    </video>


    <!-- 3번 너 영상 배경 -->

    <video
        id="backgroundVideo2"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_Media_TiOpGgCXeT0_001_480p%20(1).mp4">
    </video>


    <!-- 4번 relations 이미지 배경 -->

    <div
        id="backgroundImage2"
        class="background-image">
    </div>


</div>


<div id="videoOverlay"></div>


<!-- ==========================================
     플레이어
========================================== -->

<div class="player">


    <div class="album">
        🎧
    </div>


    <div
        class="title"
        id="songTitle">

        곡을 선택해주세요

    </div>


    <div
        class="artist"
        id="songArtist">

        N0DE SOUNDS

    </div>


    <audio
        id="audio"
        controls
        preload="metadata">
    </audio>


    <div class="playlist-title">
        PLAYLIST
    </div>


    <ul
        class="playlist"
        id="playlist">
    </ul>


</div>


<script>

const audio =
    document.getElementById("audio");

const background =
    document.getElementById("videoBackground");

const backgroundVideo1 =
    document.getElementById("backgroundVideo1");

const backgroundVideo2 =
    document.getElementById("backgroundVideo2");

const backgroundImage1 =
    document.getElementById("backgroundImage1");

const backgroundImage2 =
    document.getElementById("backgroundImage2");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playlist =
    document.getElementById("playlist");


let currentIndex = 0;


/* ==========================================
   이미지 배경 미리 로드
========================================== */

backgroundImage1.style.backgroundImage =
    "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/85a074861f51fc3a560a6077e1162bbb.gif')";

backgroundImage2.style.backgroundImage =
    "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/40d89af3f71dddcdca7065a07fc6e069.jpg')";


/* ==========================================
   음악 데이터
========================================== */

const songs = [

    /* 1번 */

    {
        title:
            "BrooklynBloodPop!",

        artist:
            "Nightcore",

        file:
            "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        background:
            "image1"
    },


    /* 2번 */

    {
        title:
            "i told u v1",

        artist:
            "midwxst",

        file:
            "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        background:
            "video1"
    },


    /* 3번 */

    {
        title:
            "너",

        artist:
            "ycs",

        file:
            "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        background:
            "video2"
    },


    /* 4번 */

    {
        title:
            "relations",

        artist:
            "이상형",

        file:
            "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        background:
            "image2"
    }

];


/* ==========================================
   모든 배경 숨기기
========================================== */

function hideAllBackgrounds() {

    backgroundVideo1.pause();
    backgroundVideo2.pause();

    backgroundVideo1.classList.remove("active");
    backgroundVideo2.classList.remove("active");
    backgroundImage1.classList.remove("active");
    backgroundImage2.classList.remove("active");

    background.classList.remove("show");
}


/* ==========================================
   현재 배경 요소 가져오기
========================================== */

function getBackgroundElement() {

    const song = songs[currentIndex];

    if (song.background === "video1") return backgroundVideo1;
    if (song.background === "video2") return backgroundVideo2;
    if (song.background === "image1") return backgroundImage1;
    if (song.background === "image2") return backgroundImage2;

    return null;
}


/* ==========================================
   배경 시작
========================================== */

function startBackground() {

    const el = getBackgroundElement();

    if (!el) {
        hideAllBackgrounds();
        return;
    }

    const isVideo =
        el === backgroundVideo1 ||
        el === backgroundVideo2;


    if (el !== backgroundVideo1) {
        backgroundVideo1.pause();
        backgroundVideo1.classList.remove("active");
    }

    if (el !== backgroundVideo2) {
        backgroundVideo2.pause();
        backgroundVideo2.classList.remove("active");
    }

    if (el !== backgroundImage1) {
        backgroundImage1.classList.remove("active");
    }

    if (el !== backgroundImage2) {
        backgroundImage2.classList.remove("active");
    }

    background.classList.add("show");

    el.classList.add("active");

    if (isVideo) {

        if (el.readyState >= 1) {
            try {
                el.currentTime = audio.currentTime;
            } catch (e) {}
        }

        el.play().catch(e => {
            console.error("배경 영상 재생 실패:", e);
        });
    }
}


/* ==========================================
   Playlist
========================================== */

function renderPlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const item =
            document.createElement("li");

        item.className = "song";

        if (index === currentIndex) {
            item.classList.add("active");
        }

        item.innerHTML = `
            <span class="number">${index + 1}</span>
            <span class="song-name">${song.title}</span>
        `;

        item.addEventListener("click", () => {
            loadSong(index);
        });

        playlist.appendChild(item);
    });
}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {

    currentIndex = index;

    const song = songs[currentIndex];

    audio.pause();

    hideAllBackgrounds();

    audio.src = song.file;
    audio.load();

    songTitle.textContent  = song.title;
    songArtist.textContent = song.artist;

    renderPlaylist();

    audio.play()
        .then(() => {
            if (song.background !== null) {
                startBackground();
            }
        })
        .catch(e => {
            console.error("음악 재생 실패:", e);
        });
}


/* ==========================================
   음악 재생
========================================== */

audio.addEventListener("play", () => {

    const song = songs[currentIndex];

    if (song.background !== null) {
        startBackground();
    } else {
        hideAllBackgrounds();
    }
});


/* ==========================================
   음악 일시정지
========================================== */

audio.addEventListener("pause", () => {

    const el = getBackgroundElement();

    if (
        el === backgroundVideo1 ||
        el === backgroundVideo2
    ) {
        el.pause();
    }
});


/* ==========================================
   싱크
========================================== */

audio.addEventListener("timeupdate", () => {

    const el = getBackgroundElement();

    if (
        el !== backgroundVideo1 &&
        el !== backgroundVideo2
    ) {
        return;
    }

    if (el.readyState < 2) {
        return;
    }

    const diff = Math.abs(
        el.currentTime - audio.currentTime
    );

    if (diff > 0.35) {
        try {
            el.currentTime = audio.currentTime;
        } catch (e) {}
    }
});


/* ==========================================
   Seek
========================================== */

audio.addEventListener("seeking", () => {

    const el = getBackgroundElement();

    if (
        el !== backgroundVideo1 &&
        el !== backgroundVideo2
    ) {
        return;
    }

    try {
        el.currentTime = audio.currentTime;
    } catch (e) {}
});


/* ==========================================
   음악 종료
========================================== */

audio.addEventListener("ended", () => {

    const next = (currentIndex + 1) % songs.length;
    loadSong(next);
});


/* ==========================================
   영상 로딩 완료 이벤트
========================================== */

backgroundVideo1.addEventListener("loadeddata", () => {

    if (
        songs[currentIndex].background === "video1" &&
        !audio.paused
    ) {
        startBackground();
    }
});

backgroundVideo2.addEventListener("loadeddata", () => {

    if (
        songs[currentIndex].background === "video2" &&
        !audio.paused
    ) {
        startBackground();
    }
});


/* ==========================================
   영상 오류
========================================== */

backgroundVideo1.addEventListener("error", () => {
    console.error("배경 영상1 로딩 실패:", backgroundVideo1.error);
});

backgroundVideo2.addEventListener("error", () => {
    console.error("배경 영상2 로딩 실패:", backgroundVideo2.error);
});


/* ==========================================
   초기화
========================================== */

renderPlaylist();
loadSong(0);

</script>

</body>
