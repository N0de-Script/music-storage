<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N1gh7m4r3 Playlist</title>

<!-- Pretendard Web Font -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-weight: 300;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    background: rgb(8, 8, 8);
    color: #ffffff;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* ==========================================
   배경 (Video / Image)
========================================== */

#videoBackground {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    background: rgb(8, 8, 8);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    pointer-events: none;
}

#videoBackground.show {
    opacity: 1;
    visibility: visible;
}

.background-video,
.background-image {
    position: absolute;
    top: -5%;
    left: -5%;
    width: 110%;
    height: 110%;
    object-fit: cover;
    display: block;
    filter: blur(8px) brightness(0.3) saturate(1.1);
    transform: scale(1.03);
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
}

.background-image {
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

.background-video.active,
.background-image.active {
    opacity: 1;
}

#videoOverlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(8, 8, 8, 0.3) 0%, rgb(8, 8, 8) 90%);
}


/* ==========================================
   Player Card
========================================== */

.player {
    position: relative;
    z-index: 10;
    width: calc(100% - 32px);
    max-width: 380px;
    padding: 28px 24px;
    border-radius: 20px;
    background: rgb(12, 12, 12);
    border: 1px solid rgb(24, 24, 24);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.brand-tag {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: #ffffff;
    opacity: 0.6;
    margin-bottom: 20px;
    text-transform: uppercase;
}


/* ==========================================
   Track Info
========================================== */

.track-info {
    text-align: center;
    width: 100%;
    margin-bottom: 20px;
}

.title {
    font-size: 20px;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: #ffffff;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist {
    font-size: 13px;
    color: #ffffff;
    font-weight: 300;
    opacity: 0.5;
}


/* ==========================================
   Progress Bar
========================================== */

.progress-section {
    width: 100%;
    margin-bottom: 20px;
}

.progress-bar-container {
    width: 100%;
    height: 4px;
    background: rgb(28, 28, 28);
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #ffffff;
    border-radius: 8px;
    transition: width 0.1s linear;
}

.time-display {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #ffffff;
    opacity: 0.5;
    margin-top: 6px;
    font-weight: 300;
}


/* ==========================================
   Controls
========================================== */

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    margin-bottom: 24px;
    width: 100%;
}

.ctrl-btn {
    background: transparent !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    opacity: 0.85;
    transition: opacity 0.2s ease, transform 0.15s ease;
}

.ctrl-btn:hover {
    opacity: 1;
    transform: scale(1.12);
}

.ctrl-btn:active {
    transform: scale(0.92);
}

.ctrl-btn svg {
    fill: #ffffff;
    display: block;
}


/* ==========================================
   Playlist Container & Animation
========================================== */

.playlist-container {
    width: 100%;
}

.playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    padding: 4px 2px;
}

.playlist-title {
    font-size: 11px;
    color: #ffffff;
    font-weight: 400;
    letter-spacing: 0.15em;
    opacity: 0.6;
}

.toggle-btn {
    background: none;
    border: none;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.6;
    transition: opacity 0.2s ease;
}

.toggle-btn:hover {
    opacity: 1;
}

#toggleIcon {
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.playlist-wrapper {
    max-height: 250px;
    opacity: 1;
    overflow: hidden;
    margin-top: 10px;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin-top 0.35s ease;
}

.playlist-container.collapsed .playlist-wrapper {
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    pointer-events: none;
}

.playlist-container.collapsed #toggleIcon {
    transform: rotate(180deg);
}

.search-input {
    width: 100%;
    padding: 8px 12px;
    margin-bottom: 8px;
    background: rgb(16, 16, 16);
    border: 1px solid rgb(25, 25, 25);
    border-radius: 8px;
    color: #ffffff;
    font-size: 12px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s ease;
}

.search-input::placeholder {
    color: #666666;
}

.search-input:focus {
    border-color: rgb(50, 50, 50);
}

.playlist {
    list-style: none;
    max-height: 150px;
    overflow-y: auto;
    border-radius: 10px;
    background: rgb(8, 8, 8);
    border: 1px solid rgb(20, 20, 20);
    padding: 4px;
}

.playlist::-webkit-scrollbar {
    width: 4px;
}
.playlist::-webkit-scrollbar-thumb {
    background: rgb(30, 30, 30);
    border-radius: 8px;
}

.song {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    border-radius: 8px;
    margin-bottom: 2px;
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.2s ease;
}

.song:hover {
    background: rgb(20, 20, 20);
}

.song.active {
    background: rgb(22, 22, 22);
    border: 1px solid rgb(40, 40, 40);
}

.number {
    width: 16px;
    text-align: center;
    color: #ffffff;
    opacity: 0.4;
    font-size: 11px;
    font-weight: 300;
}

.song-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
    color: #ffffff;
    font-weight: 300;
}

.artist-sub {
    font-size: 11px;
    color: #777777;
    margin-left: 4px;
    font-weight: 300;
}


/* ==========================================
   Windows Style Notification (오른쪽 하단 팝업)
========================================== */

.toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
}

.toast {
    background: rgb(16, 16, 16);
    border: 1px solid rgb(40, 40, 40);
    color: #ffffff;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 300;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: auto;
    min-width: 240px;
    max-width: 320px;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

.toast-icon {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    opacity: 0.8;
    flex-shrink: 0;
}

</style>
</head>


<body>

<!-- 배경 이미지/동영상 -->
<div id="videoBackground">
    <div id="backgroundImage1" class="background-image"></div>
    <video id="backgroundVideo1" class="background-video" muted loop playsinline preload="auto" src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20(2).mp4"></video>
    <video id="backgroundVideo2" class="background-video" muted loop playsinline preload="auto" src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_Media_TiOpGgCXeT0_001_480p%20(1).mp4"></video>
    <div id="backgroundImage2" class="background-image"></div>
</div>

<div id="videoOverlay"></div>


<!-- Player Card -->
<div class="player">

    <div class="brand-tag">N1gh7m4r3 Playlist</div>

    <!-- Track Info -->
    <div class="track-info">
        <div class="title" id="songTitle">곡을 선택해주세요</div>
        <div class="artist" id="songArtist">N1gh7m4r3 Playlist</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="durationTime">0:00</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="ctrl-btn" id="rewindBtn" title="10초 뒤로">
            <svg width="32" height="32" viewBox="0 0 24 24">
                <path d="M11 7.19v9.62c0 .58-.65.91-1.12.57L3.6 12.57c-.43-.31-.43-.95 0-1.26l6.28-4.8c.47-.35 1.12-.01 1.12.57zm9.5 0v9.62c0 .58-.65.91-1.12.57l-6.28-4.81c-.43-.31-.43-.95 0-1.26l6.28-4.8c.47-.35 1.12-.01 1.12.57z"/>
            </svg>
        </button>
        <button class="ctrl-btn" id="playPauseBtn" title="재생/일시정지">
            <svg id="playIcon" width="36" height="36" viewBox="0 0 24 24">
                <path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18c.62-.39.62-1.29 0-1.69L9.54 5.98C8.87 5.55 8 6.03 8 6.82z"/>
            </svg>
            <svg id="pauseIcon" width="36" height="36" viewBox="0 0 24 24" style="display:none;">
                <path d="M8 19c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2s-2 .9-2 2v10c0 1.1.9 2 2 2zm6-12v10c0 1.1.9 2 2 2s2-.9 2-2V7c0-1.1-.9-2-2-2s-2 .9-2 2z"/>
            </svg>
        </button>
        <button class="ctrl-btn" id="forwardBtn" title="10초 앞으로">
            <svg width="32" height="32" viewBox="0 0 24 24">
                <path d="M13 16.81V7.19c0-.58.65-.91 1.12-.57l6.28 4.8c.43.31.43.95 0 1.26l-6.28 4.81c-.47.34-1.12 0-1.12-.58zm-9.5 0V7.19c0-.58.65-.91 1.12-.57l6.28 4.8c.43.31.43.95 0 1.26l-6.28 4.81c-.47.34-1.12 0-1.12-.58z"/>
            </svg>
        </button>
    </div>

    <!-- 숨겨진 오디오 태그 -->
    <audio id="audio" preload="metadata"></audio>

    <!-- Playlist -->
    <div class="playlist-container" id="playlistContainer">
        <div class="playlist-header" id="playlistHeader">
            <div class="playlist-title">PLAYLIST</div>
            <button class="toggle-btn" id="togglePlaylistBtn" title="목록 열기/닫기">
                <svg id="toggleIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>
        <div class="playlist-wrapper">
            <input type="text" class="search-input" id="searchInput" placeholder="곡 또는 아티스트 검색..." autocomplete="off">
            <ul class="playlist" id="playlist"></ul>
        </div>
    </div>

</div>

<!-- 우측 하단 알림창 컨테이너 -->
<div class="toast-container" id="toastContainer"></div>


<script>

const audio = document.getElementById("audio");
const background = document.getElementById("videoBackground");
const backgroundVideo1 = document.getElementById("backgroundVideo1");
const backgroundVideo2 = document.getElementById("backgroundVideo2");
const backgroundImage1 = document.getElementById("backgroundImage1");
const backgroundImage2 = document.getElementById("backgroundImage2");

const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");
const playlist = document.getElementById("playlist");

const playPauseBtn = document.getElementById("playPauseBtn");
const playIcon = document.getElementById("playIcon");
const pauseIcon = document.getElementById("pauseIcon");
const rewindBtn = document.getElementById("rewindBtn");
const forwardBtn = document.getElementById("forwardBtn");

const progressBarContainer = document.getElementById("progressBarContainer");
const progressFill = document.getElementById("progressFill");
const currentTimeEl = document.getElementById("currentTime");
const durationTimeEl = document.getElementById("durationTime");

const playlistContainer = document.getElementById("playlistContainer");
const playlistHeader = document.getElementById("playlistHeader");
const searchInput = document.getElementById("searchInput");
const toastContainer = document.getElementById("toastContainer");

let currentIndex = 0;


backgroundImage1.style.backgroundImage = "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/85a074861f51fc3a560a6077e1162bbb.gif')";
backgroundImage2.style.backgroundImage = "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/40d89af3f71dddcdca7065a07fc6e069.jpg')";


const songs = [
    { title: "BrooklynBloodPop!", artist: "Syko", file: "./Nightcore%20-%20BrooklynBloodPop!.mp3", background: "image1" },
    { title: "i told u v1", artist: "midwxst", file: "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3", background: "video1" },
    { title: "너", artist: "ycs", file: "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3", background: "video2" },
    { title: "relations", artist: "이상형", file: "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3", background: "image2" }
];


/* ==========================================
   알림 팝업 함수 (Windows 토스트)
========================================== */

function showToast(message) {
    if (!toastContainer) return;

    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerHTML = `<span class="toast-icon"></span><span>${message}</span>`;

    toastContainer.appendChild(toast);

    // setTimeout을 이용해 DOM 생성 후 딜레이 없이 확실하게 트랜지션 실행
    setTimeout(() => {
        toast.classList.add("show");
    }, 10);

    setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => {
            toast.remove();
        }, 300);
    }, 2500);
}


function hideAllBackgrounds() {
    backgroundVideo1.pause();
    backgroundVideo2.pause();
    backgroundVideo1.classList.remove("active");
    backgroundVideo2.classList.remove("active");
    backgroundImage1.classList.remove("active");
    backgroundImage2.classList.remove("active");
    background.classList.remove("show");
}

function getBackgroundElement() {
    const song = songs[currentIndex];
    if (song.background === "video1") return backgroundVideo1;
    if (song.background === "video2") return backgroundVideo2;
    if (song.background === "image1") return backgroundImage1;
    if (song.background === "image2") return backgroundImage2;
    return null;
}

function startBackground() {
    const el = getBackgroundElement();
    if (!el) {
        hideAllBackgrounds();
        return;
    }

    const isVideo = (el === backgroundVideo1 || el === backgroundVideo2);

    if (el !== backgroundVideo1) { backgroundVideo1.pause(); backgroundVideo1.classList.remove("active"); }
    if (el !== backgroundVideo2) { backgroundVideo2.pause(); backgroundVideo2.classList.remove("active"); }
    if (el !== backgroundImage1) backgroundImage1.classList.remove("active");
    if (el !== backgroundImage2) backgroundImage2.classList.remove("active");

    background.classList.add("show");
    el.classList.add("active");

    if (isVideo) {
        if (el.readyState >= 1) {
            try { el.currentTime = audio.currentTime; } catch (e) {}
        }
        el.play().catch(e => console.error(e));
    }
}


function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}


function renderPlaylist(filter = "") {
    playlist.innerHTML = "";
    const cleanFilter = filter.toLowerCase().trim();

    songs.forEach((song, index) => {
        const matchTitle = song.title.toLowerCase().includes(cleanFilter);
        const matchArtist = song.artist.toLowerCase().includes(cleanFilter);

        if (matchTitle || matchArtist) {
            const item = document.createElement("li");
            item.className = "song";
            if (index === currentIndex) item.classList.add("active");

            item.innerHTML = `
                <span class="number">${index + 1}</span>
                <span class="song-name">${song.title} <span class="artist-sub">- ${song.artist}</span></span>
            `;

            item.addEventListener("click", () => loadSong(index));
            playlist.appendChild(item);
        }
    });
}

searchInput.addEventListener("input", (e) => {
    renderPlaylist(e.target.value);
});


playlistHeader.addEventListener("click", () => {
    playlistContainer.classList.toggle("collapsed");
});


/* ==========================================
   곡 로드 및 알림 발생
========================================== */

function loadSong(index) {
    currentIndex = index;
    const song = songs[currentIndex];

    audio.pause();
    hideAllBackgrounds();

    audio.src = song.file;
    audio.load();

    songTitle.textContent = song.title;
    songArtist.textContent = song.artist;

    renderPlaylist(searchInput.value);

    // 곡 선택 시 팝업 알림 출력
    showToast(`'${song.title}' 곡이 선택되었습니다!`);

    audio.play()
        .then(() => {
            if (song.background !== null) startBackground();
        })
        .catch(e => console.error("Autoplay restricted or file not found:", e));
}


/* ==========================================
   컨트롤 버튼 및 알림 구현
========================================== */

playPauseBtn.addEventListener("click", () => {
    if (audio.paused) {
        audio.play().catch(e => console.error(e));
        showToast("노래 재생을 시작했습니다!");
    } else {
        audio.pause();
        showToast("노래를 일시정지했습니다.");
    }
});

rewindBtn.addEventListener("click", () => {
    if (audio.duration) {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
    }
    showToast("노래를 10초 뒤로 되돌렸습니다!");
});

forwardBtn.addEventListener("click", () => {
    if (audio.duration) {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
    }
    showToast("노래를 10초 앞으로 건너뛰었습니다!");
});


progressBarContainer.addEventListener("click", (e) => {
    const width = progressBarContainer.clientWidth;
    const clickX = e.offsetX;
    const duration = audio.duration;

    if (duration) {
        audio.currentTime = (clickX / width) * duration;
    }
});


audio.addEventListener("play", () => {
    playIcon.style.display = "none";
    pauseIcon.style.display = "block";

    const song = songs[currentIndex];
    if (song.background !== null) {
        startBackground();
    } else {
        hideAllBackgrounds();
    }
});

audio.addEventListener("pause", () => {
    playIcon.style.display = "block";
    pauseIcon.style.display = "none";

    const el = getBackgroundElement();
    if (el === backgroundVideo1 || el === backgroundVideo2) {
        el.pause();
    }
});

audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${progressPercent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
    }

    const el = getBackgroundElement();
    if (el !== backgroundVideo1 && el !== backgroundVideo2) return;
    if (el.readyState < 2) return;

    const diff = Math.abs(el.currentTime - audio.currentTime);
    if (diff > 0.35) {
        try { el.currentTime = audio.currentTime; } catch (e) {}
    }
});

audio.addEventListener("seeking", () => {
    const el = getBackgroundElement();
    if (el !== backgroundVideo1 && el !== backgroundVideo2) return;
    try { el.currentTime = audio.currentTime; } catch (e) {}
});

audio.addEventListener("ended", () => {
    const next = (currentIndex + 1) % songs.length;
    loadSong(next);
});


backgroundVideo1.addEventListener("loadeddata", () => {
    if (songs[currentIndex].background === "video1" && !audio.paused) startBackground();
});

backgroundVideo2.addEventListener("loadeddata", () => {
    if (songs[currentIndex].background === "video2" && !audio.paused) startBackground();
});


/* 초기화 */
renderPlaylist();
loadSong(0);

</script>

</body>
</html>
