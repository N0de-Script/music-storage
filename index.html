<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N0DE SOUNDS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", sans-serif;
    background: #080a10;
    color: #ffffff;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ==========================================
   동적 리퀴드 오라 배경
========================================== */
.liquid-glow {
    position: fixed;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(120, 119, 198, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    filter: blur(80px);
    pointer-events: none;
    animation: liquidFloat 8s infinite alternate ease-in-out;
}

@keyframes liquidFloat {
    0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    100% { transform: translate(-45%, -55%) scale(1.2) rotate(15deg); }
}

/* ==========================================
   배경 미디어 레이어
========================================== */
#videoBackground {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    background: #080a10;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    pointer-events: none;
}

#videoBackground.show {
    opacity: 1;
    visibility: visible;
}

.background-video,
.background-image {
    position: absolute;
    inset: -5%;
    width: 110%;
    height: 110%;
    object-fit: cover;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    filter: blur(40px) brightness(0.5) saturate(1.5);
    transform: scale(1.05);
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
}

.background-video.active,
.background-image.active {
    opacity: 1;
}

#videoOverlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
}

/* ==========================================
   iOS Liquid Glass Player Frame
========================================== */
.player {
    position: relative;
    z-index: 10;
    width: calc(100% - 32px);
    max-width: 420px;
    padding: 28px;
    border-radius: 40px;
    
    /* Liquid Glass Effect */
    background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.22) 0%, 
        rgba(255, 255, 255, 0.03) 40%, 
        rgba(255, 255, 255, 0.12) 100%
    );
    backdrop-filter: blur(50px) saturate(220%);
    -webkit-backdrop-filter: blur(50px) saturate(220%);
    
    /* Glass Borders & Edge Gloss */
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-top: 1.5px solid rgba(255, 255, 255, 0.65);
    border-left: 1.5px solid rgba(255, 255, 255, 0.45);
    
    box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 2px rgba(255, 255, 255, 0.8),
        inset 0 -2px 15px rgba(255, 255, 255, 0.08);
}

/* 앨범 아트 */
.album {
    width: 100%;
    height: 180px;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    margin-bottom: 20px;
    background: linear-gradient(145deg, rgba(255,255,255,0.18), rgba(0,0,0,0.3));
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        0 15px 30px rgba(0, 0, 0, 0.35);
    transition: transform 0.3s ease;
}

.album:hover {
    transform: scale(1.02);
}

/* 곡 타이틀 */
.title {
    text-align: center;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.02em;
    word-break: break-word;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
}

.artist {
    text-align: center;
    margin-top: 4px;
    margin-bottom: 22px;
    color: rgba(255, 255, 255, 0.65);
    font-size: 14px;
    font-weight: 500;
}

/* ==========================================
   커스텀 Liquid Glass 오디오 컨트롤러
========================================== */
.controls-container {
    margin-bottom: 22px;
}

/* 탐색 바 및 시간 표시 */
.progress-area {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
}

.progress-bar-container {
    position: relative;
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    cursor: pointer;
    overflow: hidden;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.6), #ffffff);
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    transition: width 0.1s linear;
}

.time-display {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    font-weight: 600;
    padding: 0 2px;
}

/* 버튼 모음 */
.button-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

.glass-btn {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    color: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255,255,255,0.4);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.glass-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.08);
}

.glass-btn:active {
    transform: scale(0.95);
}

.btn-small {
    width: 42px;
    height: 42px;
    font-size: 14px;
}

.btn-large {
    width: 58px;
    height: 58px;
    font-size: 20px;
    background: rgba(255, 255, 255, 0.22);
}

/* ==========================================
   Liquid Playlist & 검색 영역
========================================== */
.playlist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px;
    margin-bottom: 10px;
    cursor: pointer;
}

.playlist-title {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.55);
    font-weight: 700;
    letter-spacing: 0.12em;
}

.toggle-btn {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

/* 접기/펼치기 부드러운 그리드 애니메이션 */
.playlist-wrapper {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    opacity: 1;
}

.playlist-wrapper.collapsed {
    grid-template-rows: 0fr;
    opacity: 0;
    pointer-events: none;
}

.playlist-inner {
    overflow: hidden;
}

/* 유리 검색창 */
.search-container {
    position: relative;
    margin-bottom: 10px;
}

.search-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 13px;
    outline: none;
    backdrop-filter: blur(10px);
    transition: all 0.25s ease;
}

.search-input::placeholder {
    color: rgba(255, 255, 255, 0.4);
}

.search-input:focus {
    background: rgba(0, 0, 0, 0.35);
    border-color: rgba(255, 255, 255, 0.35);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.12);
}

/* 목록 */
.playlist {
    list-style: none;
    max-height: 170px;
    overflow-y: auto;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.playlist::-webkit-scrollbar {
    width: 4px;
}
.playlist::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.25);
    border-radius: 4px;
}

.song {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    transition: background 0.2s ease, transform 0.15s ease;
}

.song:last-child {
    border-bottom: none;
}

.song:hover {
    background: rgba(255, 255, 255, 0.12);
}

.song:active {
    transform: scale(0.98);
}

.song.active {
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.05));
    border-left: 3px solid #ffffff;
}

.number {
    width: 20px;
    min-width: 20px;
    text-align: center;
    color: rgba(255, 255, 255, 0.45);
    font-size: 12px;
    font-weight: 600;
}

.song-info {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.song-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
    font-weight: 600;
}

.song-artist-sub {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 1px;
}

.empty-search {
    padding: 16px;
    text-align: center;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
}

@media (max-width: 500px) {
    .player {
        padding: 22px;
        border-radius: 34px;
    }
    .album {
        height: 140px;
        font-size: 52px;
    }
}
</style>
</head>

<body>

<div class="liquid-glow"></div>

<!-- 배경 레이어 -->
<div id="videoBackground">
    <div id="backgroundImage1" class="background-image"></div>
    <video id="backgroundVideo1" class="background-video" muted loop playsinline preload="auto" src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20(2).mp4"></video>
    <video id="backgroundVideo2" class="background-video" muted loop playsinline preload="auto" src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_Media_TiOpGgCXeT0_001_480p%20(1).mp4"></video>
    <div id="backgroundImage2" class="background-image"></div>
</div>

<div id="videoOverlay"></div>

<!-- iOS Liquid Glass 플레이어 카드 -->
<div class="player">
    <div class="album">🎧</div>
    <div class="title" id="songTitle">곡을 선택해주세요</div>
    <div class="artist" id="songArtist">N0DE SOUNDS</div>

    <!-- 숨김 오디오 엘리먼트 -->
    <audio id="audio" preload="metadata"></audio>

    <!-- 커스텀 오디오 컨트롤러 -->
    <div class="controls-container">
        <div class="progress-area">
            <div class="progress-bar-container" id="progressBarContainer">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <div class="button-row">
            <button class="glass-btn btn-small" id="prevBtn" title="이전 곡">⏮</button>
            <button class="glass-btn btn-large" id="playBtn" title="재생/일시정지">▶</button>
            <button class="glass-btn btn-small" id="nextBtn" title="다음 곡">⏭</button>
        </div>
    </div>

    <!-- 플레이리스트 헤더 & 토글 -->
    <div class="playlist-header" id="playlistToggle">
        <span class="playlist-title">PLAYLIST</span>
        <button class="toggle-btn" id="toggleIcon">▲</button>
    </div>

    <!-- 플레이리스트 & 검색 -->
    <div class="playlist-wrapper" id="playlistWrapper">
        <div class="playlist-inner">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="곡 제목 또는 아티스트 검색..." autocomplete="off">
            </div>
            <ul class="playlist" id="playlist"></ul>
        </div>
    </div>
</div>

<script>
const audio = document.getElementById("audio");
const background = document.getElementById("videoBackground");
const backgroundVideo1 = document.getElementById("backgroundVideo1");
const backgroundVideo2 = document.getElementById("backgroundVideo2");
const backgroundImage1 = document.getElementById("backgroundImage1");
const backgroundImage2 = document.getElementById("backgroundImage2");

const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");
const playlist = document.getElementById("playlist");
const playlistToggle = document.getElementById("playlistToggle");
const playlistWrapper = document.getElementById("playlistWrapper");
const toggleIcon = document.getElementById("toggleIcon");
const searchInput = document.getElementById("searchInput");

const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const progressBarContainer = document.getElementById("progressBarContainer");
const progressFill = document.getElementById("progressFill");
const currentTimeEl = document.getElementById("currentTime");
const durationTimeEl = document.getElementById("durationTime");

let currentIndex = 0;
let isCollapsed = false;

backgroundImage1.style.backgroundImage = "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/85a074861f51fc3a560a6077e1162bbb.gif')";
backgroundImage2.style.backgroundImage = "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/40d89af3f71dddcdca7065a07fc6e069.jpg')";

const songs = [
    { title: "BrooklynBloodPop!", artist: "Nightcore", file: "./Nightcore%20-%20BrooklynBloodPop!.mp3", background: "image1" },
    { title: "i told u v1", artist: "midwxst", file: "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3", background: "video1" },
    { title: "너", artist: "ycs", file: "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3", background: "video2" },
    { title: "relations", artist: "이상형", file: "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3", background: "image2" }
];

function hideAllBackgrounds() {
    backgroundVideo1.pause();
    backgroundVideo2.pause();
    backgroundVideo1.classList.remove("active");
    backgroundVideo2.classList.remove("active");
    backgroundImage1.classList.remove("active");
    backgroundImage2.classList.remove("active");
    background.classList.remove("show");
}

function getBackgroundElement() {
    const song = songs[currentIndex];
    if (song.background === "video1") return backgroundVideo1;
    if (song.background === "video2") return backgroundVideo2;
    if (song.background === "image1") return backgroundImage1;
    if (song.background === "image2") return backgroundImage2;
    return null;
}

function startBackground() {
    const el = getBackgroundElement();
    if (!el) {
        hideAllBackgrounds();
        return;
    }

    const isVideo = el === backgroundVideo1 || el === backgroundVideo2;

    if (el !== backgroundVideo1) { backgroundVideo1.pause(); backgroundVideo1.classList.remove("active"); }
    if (el !== backgroundVideo2) { backgroundVideo2.pause(); backgroundVideo2.classList.remove("active"); }
    if (el !== backgroundImage1) backgroundImage1.classList.remove("active");
    if (el !== backgroundImage2) backgroundImage2.classList.remove("active");

    background.classList.add("show");
    el.classList.add("active");

    if (isVideo) {
        if (el.readyState >= 1) {
            try { el.currentTime = audio.currentTime; } catch (e) {}
        }
        el.play().catch(e => console.error("배경 영상 재생 실패:", e));
    }
}

function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}

/* 커스텀 오디오 컨트롤 동작 */
playBtn.addEventListener("click", () => {
    if (audio.paused) {
        audio.play().catch(e => console.error("재생 실패:", e));
    } else {
        audio.pause();
    }
});

prevBtn.addEventListener("click", () => {
    let nextIndex = currentIndex - 1;
    if (nextIndex < 0) nextIndex = songs.length - 1;
    loadSong(nextIndex);
});

nextBtn.addEventListener("click", () => {
    let nextIndex = (currentIndex + 1) % songs.length;
    loadSong(nextIndex);
});

/* 프로그레스 바 클릭 시 탐색 */
progressBarContainer.addEventListener("click", (e) => {
    const rect = progressBarContainer.getBoundingClientRect();
    const clickPosition = (e.clientX - rect.left) / rect.width;
    if (audio.duration) {
        audio.currentTime = clickPosition * audio.duration;
    }
});

/* 오디오 시간 업데이트 핸들러 */
audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
    }

    const el = getBackgroundElement();
    if (el !== backgroundVideo1 && el !== backgroundVideo2) return;
    if (el.readyState < 2) return;

    const diff = Math.abs(el.currentTime - audio.currentTime);
    if (diff > 0.35) {
        try { el.currentTime = audio.currentTime; } catch (e) {}
    }
});

audio.addEventListener("loadedmetadata", () => {
    durationTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener("play", () => {
    playBtn.textContent = "❚❚";
    const song = songs[currentIndex];
    if (song.background !== null) startBackground();
    else hideAllBackgrounds();
});

audio.addEventListener("pause", () => {
    playBtn.textContent = "▶";
    const el = getBackgroundElement();
    if (el === backgroundVideo1 || el === backgroundVideo2) el.pause();
});

audio.addEventListener("ended", () => {
    const next = (currentIndex + 1) % songs.length;
    loadSong(next);
});

/* 재생목록 렌더링 & 검색 */
function renderPlaylist(filter = "") {
    playlist.innerHTML = "";
    const cleanFilter = filter.trim().toLowerCase();

    const filteredSongs = songs.map((song, originalIndex) => ({ ...song, originalIndex }))
        .filter(song => song.title.toLowerCase().includes(cleanFilter) || song.artist.toLowerCase().includes(cleanFilter));

    if (filteredSongs.length === 0) {
        playlist.innerHTML = `<li class="empty-search">검색 결과가 없습니다.</li>`;
        return;
    }

    filteredSongs.forEach((song) => {
        const item = document.createElement("li");
        item.className = "song";
        if (song.originalIndex === currentIndex) {
            item.classList.add("active");
        }

        item.innerHTML = `
            <span class="number">${song.originalIndex + 1}</span>
            <div class="song-info">
                <span class="song-name">${song.title}</span>
                <span class="song-artist-sub">${song.artist}</span>
            </div>
        `;

        item.addEventListener("click", () => {
            loadSong(song.originalIndex);
        });

        playlist.appendChild(item);
    });
}

searchInput.addEventListener("input", (e) => {
    renderPlaylist(e.target.value);
});

playlistToggle.addEventListener("click", () => {
    isCollapsed = !isCollapsed;
    if (isCollapsed) {
        playlistWrapper.classList.add("collapsed");
        toggleIcon.style.transform = "rotate(180deg)";
    } else {
        playlistWrapper.classList.remove("collapsed");
        toggleIcon.style.transform = "rotate(0deg)";
    }
});

function loadSong(index) {
    currentIndex = index;
    const song = songs[currentIndex];

    audio.pause();
    hideAllBackgrounds();

    audio.src = song.file;
    audio.load();

    songTitle.textContent = song.title;
    songArtist.textContent = song.artist;

    renderPlaylist(searchInput.value);

    audio.play()
        .then(() => {
            if (song.background !== null) startBackground();
        })
        .catch(e => console.error("음악 재생 실패:", e));
}

backgroundVideo1.addEventListener("loadeddata", () => {
    if (songs[currentIndex].background === "video1" && !audio.paused) startBackground();
});

backgroundVideo2.addEventListener("loadeddata", () => {
    if (songs[currentIndex].background === "video2" && !audio.paused) startBackground();
});

renderPlaylist();
loadSong(0);
</script>

</body>
</html>
