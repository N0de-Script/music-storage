/* ==========================================
   배경
========================================== */

#videoBackground {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;

    overflow: hidden;

    background: #10131a;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.65s cubic-bezier(.22,1,.36,1),
        visibility 0.65s ease;

    pointer-events: none;
}


/* 배경 표시 */

#videoBackground.show {
    opacity: 1;
    visibility: visible;
}


/* ==========================================
   배경 영상
   너무 흐리지 않도록 수정
========================================== */

.background-video {
    position: absolute;

    top: -3%;
    left: -3%;

    width: 106%;
    height: 106%;

    object-fit: cover;

    display: block;

    /*
        기존 18px blur 제거 수준으로 낮춤
        → 배경이 선명하게 보임
    */

    filter:
        blur(2px)
        brightness(0.58)
        saturate(1.08)
        contrast(1.02);

    transform: scale(1.025);

    opacity: 0;

    transition:
        opacity 0.65s cubic-bezier(.22,1,.36,1);

    pointer-events: none;
}


.background-video.active {
    opacity: 1;
}


/* ==========================================
   배경 이미지 / GIF
========================================== */

.background-image {
    position: absolute;

    inset: -3%;

    width: 106%;
    height: 106%;

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    /*
        이미지도 거의 선명하게
    */

    filter:
        blur(2px)
        brightness(0.58)
        saturate(1.08)
        contrast(1.02);

    transform: scale(1.025);

    opacity: 0;

    transition:
        opacity 0.65s cubic-bezier(.22,1,.36,1);

    pointer-events: none;
}


.background-image.active {
    opacity: 1;
}

   배경 오버레이
========================================== */

        배경을 덮는 어두운 느낌도 약하게

            rgba(0,0,0,0.12),
            rgba(0,0,0,0.18)
        );

}


/* ==========================================
   플레이어 위치
========================================== */

.player-wrapper {

}


/* ==========================================
   Liquid Glass Player
========================================== */

.player {
    width: 100%;

    padding: 22px;

        iOS Liquid Glass 핵심
    */

    background:
        linear-gradient(

            rgba(255,255,255,0.075) 45%,

    backdrop-filter:
        blur(28px)
        saturate(180%)
        brightness(1.08);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(180%)
        brightness(1.08);

        1px solid

    /*
        유리 내부 + 외부 그림자

    box-shadow:

        0 5px 20px

    position: relative;

    overflow: hidden;

    transform:
        translateZ(0);

    isolation: isolate;
}


/* ==========================================
   Liquid Glass 빛 반사
========================================== */

.player::before {
    content: "";

    position: absolute;

    top: -120%;
    left: -70%;

}


/*

        radial-gradient(

<script>


/* ==========================================
   DOM
========================================== */

const audio =
    document.getElementById("audio");

const background =
    document.getElementById("videoBackground");

const backgroundVideo1 =
    document.getElementById("backgroundVideo1");

const backgroundVideo2 =
    document.getElementById("backgroundVideo2");

const backgroundImage1 =
    document.getElementById("backgroundImage1");

const backgroundImage2 =
    document.getElementById("backgroundImage2");

const songTitle =
    document.getElementById("songTitle");

    document.getElementById("songArtist");

    document.getElementById("playlist");

const playerWrapper =
    document.getElementById("playerWrapper");

    document.getElementById("closePlayer");

    document.getElementById("openPlayer");

const searchButton =
    document.getElementById("searchButton");

const searchContainer =
    document.getElementById("searchContainer");

const searchBox =
    document.getElementById("searchBox");


let currentIndex = 0;

let isPlayerOpen = true;

let searchQuery = "";


/* ==========================================
   배경 이미지
========================================== */

backgroundImage1.style.backgroundImage =
    "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/85a074861f51fc3a560a6077e1162bbb.gif')";

backgroundImage2.style.backgroundImage =
    "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/40d89af3f71dddcdca7065a07fc6e069.jpg')";


/* ==========================================
   음악 데이터
========================================== */

const songs = [

    {
        title:
            "BrooklynBloodPop!",

        artist:
            "Nightcore",

        file:
            "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        background:
            "image1"
    },

    {
        title:
            "i told u v1",

        artist:
            "midwxst",

        file:
            "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        background:
            "video1"
    },

    {
        title:
            "너",

        artist:
            "ycs",

        file:
            "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        background:
            "video2"
    },

    {
        title:
            "relations",

        artist:
            "이상형",

        file:
            "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        background:
            "image2"
    }

];


/* ==========================================
   배경 숨기기
========================================== */

function hideAllBackgrounds() {

    backgroundVideo1.pause();
    backgroundVideo2.pause();

    backgroundVideo1.classList.remove("active");
    backgroundVideo2.classList.remove("active");

    backgroundImage1.classList.remove("active");
    backgroundImage2.classList.remove("active");

    background.classList.remove("show");
}


/* ==========================================
   현재 배경 가져오기
========================================== */

function getBackgroundElement() {

    const song =
        songs[currentIndex];

    if (song.background === "video1")
        return backgroundVideo1;

    if (song.background === "video2")
        return backgroundVideo2;

    if (song.background === "image1")
        return backgroundImage1;

    if (song.background === "image2")
        return backgroundImage2;

    return null;
}


/* ==========================================
   배경 시작
========================================== */

function startBackground() {

    const el =
        getBackgroundElement();

    if (!el) {

        hideAllBackgrounds();

        return;
    }


    const isVideo =
        el === backgroundVideo1 ||
        el === backgroundVideo2;


    if (el !== backgroundVideo1) {

        backgroundVideo1.pause();

        backgroundVideo1.classList.remove(
            "active"
        );
    }


    if (el !== backgroundVideo2) {

        backgroundVideo2.pause();

        backgroundVideo2.classList.remove(
            "active"
        );
    }


    if (el !== backgroundImage1) {

        backgroundImage1.classList.remove(
            "active"
        );
    }


    if (el !== backgroundImage2) {

        backgroundImage2.classList.remove(
            "active"
        );
    }


    background.classList.add("show");

    el.classList.add("active");


    if (isVideo) {

        if (el.readyState >= 1) {

            try {

                el.currentTime =
                    audio.currentTime;

            } catch (e) {}

        }


        el.play().catch(e => {

            console.error(
                "배경 영상 재생 실패:",
                e
            );

        });

    }

}


/* ==========================================
   Playlist 렌더링
========================================== */

function renderPlaylist() {

    playlist.innerHTML = "";


    songs.forEach(
        (song, index) => {

            const searchText =
                (
                    song.title +
                    " " +
                    song.artist
                ).toLowerCase();


            if (
                searchQuery &&
                !searchText.includes(
                    searchQuery.toLowerCase()
                )
            ) {

                return;

            }


            const item =
                document.createElement("li");


            item.className =
                "song";


            if (
                index === currentIndex
            ) {

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <span class="number">
                    ${index + 1}
                </span>

                <span class="song-name">
                    ${song.title}
                </span>

            `;


            item.addEventListener(
                "click",
                () => {

                    loadSong(index);

                }
            );


            playlist.appendChild(item);

        }
    );

}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {

    currentIndex = index;

    const song =
        songs[currentIndex];


    audio.pause();

    hideAllBackgrounds();


    audio.src =
        song.file;

    audio.load();


    songTitle.textContent =
        song.title;

    songArtist.textContent =
        song.artist;


    renderPlaylist();


    audio.play()
        .then(() => {

            if (
                song.background !== null
            ) {

                startBackground();

            }

        })
        .catch(e => {

            console.error(
                "음악 재생 실패:",
                e
            );

        });

}


/* ==========================================
   음악 재생
========================================== */

audio.addEventListener(
    "play",
    () => {

        const song =
            songs[currentIndex];


        if (
            song.background !== null
        ) {

            startBackground();

        } else {

            hideAllBackgrounds();

        }

    }
);


/* ==========================================
   일시정지
========================================== */

audio.addEventListener(
    "pause",
    () => {

        const el =
            getBackgroundElement();


        if (
            el === backgroundVideo1 ||
            el === backgroundVideo2
        ) {

            el.pause();

        }

    }
);


/* ==========================================
   영상 싱크
========================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        const el =
            getBackgroundElement();


        if (
            el !== backgroundVideo1 &&
            el !== backgroundVideo2
        ) {

            return;

        }


        if (
            el.readyState < 2
        ) {

            return;

        }


        const diff =
            Math.abs(
                el.currentTime -
                audio.currentTime
            );


        if (
            diff > 0.35
        ) {

            try {

                el.currentTime =
                    audio.currentTime;

            } catch (e) {}

        }

    }
);


/* ==========================================
   Seek
========================================== */

audio.addEventListener(
    "seeking",
    () => {

        const el =
            getBackgroundElement();


        if (
            el !== backgroundVideo1 &&
            el !== backgroundVideo2
        ) {

            return;

        }


        try {

            el.currentTime =
                audio.currentTime;

        } catch (e) {}

    }
);


/* ==========================================
   음악 종료
========================================== */

audio.addEventListener(
    "ended",
    () => {

        const next =
            (currentIndex + 1) %
            songs.length;


        loadSong(next);

    }
);


/* ==========================================
   영상 로딩
========================================== */

backgroundVideo1.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background ===
                "video1" &&
            !audio.paused
        ) {

            startBackground();

        }

    }
);


backgroundVideo2.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background ===
                "video2" &&
            !audio.paused
        ) {

            startBackground();

        }

    }
);


/* ==========================================
   영상 오류
========================================== */

backgroundVideo1.addEventListener(
    "error",
    () => {

        console.error(
            "배경 영상1 로딩 실패:",
            backgroundVideo1.error
        );

    }
);


backgroundVideo2.addEventListener(
    "error",
    () => {

        console.error(
            "배경 영상2 로딩 실패:",
            backgroundVideo2.error
        );

    }
);


/* ==========================================
   플레이어 닫기
========================================== */

closePlayer.addEventListener(
    "click",
    () => {

        if (!isPlayerOpen)
            return;


        isPlayerOpen = false;


        searchContainer.classList.remove(
            "open"
        );


        playerWrapper.classList.add(
            "closed"
        );


        setTimeout(
            () => {

                openPlayer.classList.add(
                    "show"
                );

            },
            180
        );

    }
);


/* ==========================================
   플레이어 열기
========================================== */

openPlayer.addEventListener(
    "click",
    () => {

        if (isPlayerOpen)
            return;


        isPlayerOpen = true;


        openPlayer.classList.remove(
            "show"
        );


        setTimeout(
            () => {

                playerWrapper.classList.remove(
                    "closed"
                );

            },
            40
        );

    }
);


/* ==========================================
   검색창
========================================== */

searchButton.addEventListener(
    "click",
    () => {

        const isOpen =
            searchContainer.classList.contains(
                "open"
            );


        if (isOpen) {

            searchContainer.classList.remove(
                "open"
            );


            searchBox.value = "";

            searchQuery = "";

            renderPlaylist();

        } else {

            searchContainer.classList.add(
                "open"
            );


            setTimeout(
                () => {

                    searchBox.focus();

                },
                180
            );

        }

    }
);


/* ==========================================
   검색
========================================== */

searchBox.addEventListener(
    "input",
    () => {

        searchQuery =
            searchBox.value.trim();


        renderPlaylist();

    }
);


/* ==========================================
   ESC
========================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key !== "Escape"
        ) {

            return;

        }


        if (
            searchContainer.classList.contains(
                "open"
            )
        ) {

            searchContainer.classList.remove(
                "open"
            );

            searchBox.value = "";

            searchQuery = "";

            renderPlaylist();

            return;

        }


        if (isPlayerOpen) {

            closePlayer.click();

        }

    }
);


/* ==========================================
   초기화
========================================== */

renderPlaylist();

loadSong(0);

</script>
