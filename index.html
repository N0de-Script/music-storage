<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N0DE SOUNDS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Arial,
        "Segoe UI",
        sans-serif;

    background: #10131a;
    color: white;

    min-height: 100vh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* ==========================================
   배경
========================================== */

#videoBackground {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;

    overflow: hidden;

    background: #10131a;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.5s ease,
        visibility 0.5s ease;

    pointer-events: none;
}


#videoBackground.show {

    opacity: 1;

    visibility: visible;
}


/* ==========================================
   배경 영상
========================================== */

.background-video {

    position: absolute;

    top: -4%;
    left: -4%;

    width: 108%;
    height: 108%;

    object-fit: cover;

    display: block;

    filter:
        blur(10px)
        brightness(0.48);

    transform: scale(1.03);

    opacity: 0;

    transition:
        opacity 0.5s ease;

    pointer-events: none;
}


.background-video.active {

    opacity: 1;
}


/* ==========================================
   배경 오버레이
========================================== */

#videoOverlay {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1;

    pointer-events: none;

    background:
        rgba(0, 0, 0, 0.25);
}


/* ==========================================
   플레이어
========================================== */

.player {

    position: relative;

    z-index: 10;

    width: calc(100% - 30px);

    max-width: 430px;

    padding: 28px;

    border-radius: 24px;

    background:
        rgba(20, 25, 35, 0.82);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    border:
        1px solid
        rgba(255, 255, 255, 0.15);

    box-shadow:
        0 25px 60px
        rgba(0, 0, 0, 0.6);
}


/* ==========================================
   앨범
========================================== */

.album {

    width: 100%;
    height: 180px;

    border-radius: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 60px;

    margin-bottom: 18px;

    background:
        rgba(255, 255, 255, 0.06);

    border:
        1px solid
        rgba(255, 255, 255, 0.1);
}


/* ==========================================
   제목
========================================== */

.title {

    text-align: center;

    font-size: 19px;

    font-weight: 700;

    line-height: 1.4;

    word-break: break-word;
}


.artist {

    text-align: center;

    margin-top: 5px;

    margin-bottom: 18px;

    color: #aeb8c7;

    font-size: 14px;
}


/* ==========================================
   오디오
========================================== */

audio {

    width: 100%;

    margin-bottom: 22px;
}


/* ==========================================
   Playlist
========================================== */

.playlist-title {

    font-size: 12px;

    color: #94a3b8;

    font-weight: 700;

    letter-spacing: 0.08em;

    margin-bottom: 10px;
}


.playlist {

    list-style: none;

    max-height: 210px;

    overflow-y: auto;

    border-radius: 14px;

    background:
        rgba(0, 0, 0, 0.2);
}


.song {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px 15px;

    cursor: pointer;

    border-bottom:
        1px solid
        rgba(255, 255, 255, 0.05);

    transition:
        background 0.2s ease;
}


.song:hover {

    background:
        rgba(255, 255, 255, 0.08);
}


.song.active {

    background:
        rgba(99, 102, 241, 0.35);
}


.number {

    width: 22px;

    min-width: 22px;

    text-align: center;

    color: #94a3b8;

    font-size: 12px;
}


.song-name {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;
}


/* ==========================================
   모바일
========================================== */

@media (max-width: 500px) {

    .player {

        padding: 20px;
    }

    .album {

        height: 150px;

        font-size: 50px;
    }

}

</style>
</head>


<body>


<!-- ==========================================
     배경 영상
========================================== -->

<div id="videoBackground">


    <!-- 3번 i told u v1 배경 -->

    <video
        id="backgroundVideo1"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20%282%29.mp4">
    </video>


    <!-- 4번 너 배경 -->

    <video
        id="backgroundVideo2"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_Media_TiOpGgCXeT0_001_480p%20%281%29.mp4">
    </video>

</div>


<div id="videoOverlay"></div>


<!-- ==========================================
     플레이어
========================================== -->

<div class="player">


    <div class="album">
        🎧
    </div>


    <div
        class="title"
        id="songTitle">

        곡을 선택해주세요

    </div>


    <div
        class="artist"
        id="songArtist">

        N0DE SOUNDS

    </div>


    <audio
        id="audio"
        controls
        preload="metadata">
    </audio>


    <div class="playlist-title">
        PLAYLIST
    </div>


    <ul
        class="playlist"
        id="playlist">
    </ul>


</div>


<script>


/* ==========================================
   요소
========================================== */

const audio =
    document.getElementById("audio");

const background =
    document.getElementById("videoBackground");

const backgroundVideo1 =
    document.getElementById("backgroundVideo1");

const backgroundVideo2 =
    document.getElementById("backgroundVideo2");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playlist =
    document.getElementById("playlist");


let currentIndex = 0;


/* ==========================================
   음악 데이터
========================================== */

const songs = [

    /* 1번 */

    {
        title:
            "NUMBER TWERKNATION28",

        artist:
            "sped up / nightcore",

        file:
            "./NUMBER%20TWERKNATION28%20(sped%20upnightcore).mp3",

        background:
            null
    },


    /* 2번 */

    {
        title:
            "BrooklynBloodPop!",

        artist:
            "Nightcore",

        file:
            "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        background:
            null
    },


    /* 3번 */

    {
        title:
            "i told u v1",

        artist:
            "midwxst",

        file:
            "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        background:
            1
    },


    /* 4번 */

    {
        title:
            "너",

        artist:
            "ycs",

        file:
            "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        background:
            2
    },


    /* 5번 */

    {
        title:
            "relations",

        artist:
            "이상형",

        file:
            "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        background:
            null
    }

];


/* ==========================================
   모든 배경 숨기기
========================================== */

function hideAllBackgrounds() {

    backgroundVideo1.pause();
    backgroundVideo2.pause();


    backgroundVideo1.classList.remove(
        "active"
    );

    backgroundVideo2.classList.remove(
        "active"
    );


    background.classList.remove(
        "show"
    );

}


/* ==========================================
   현재 배경 가져오기
========================================== */

function getBackgroundVideo() {

    const song =
        songs[currentIndex];


    if (
        song.background === 1
    ) {

        return backgroundVideo1;

    }


    if (
        song.background === 2
    ) {

        return backgroundVideo2;

    }


    return null;

}


/* ==========================================
   배경 시작
========================================== */

function startBackground() {

    const video =
        getBackgroundVideo();


    /*
     * 현재 곡에 배경이 없는 경우
     */

    if (!video) {

        hideAllBackgrounds();

        return;

    }


    /*
     * 다른 배경 완전히 정리
     */

    if (
        video !== backgroundVideo1
    ) {

        backgroundVideo1.pause();

        backgroundVideo1.classList.remove(
            "active"
        );

    }


    if (
        video !== backgroundVideo2
    ) {

        backgroundVideo2.pause();

        backgroundVideo2.classList.remove(
            "active"
        );

    }


    /*
     * 배경 표시
     */

    background.classList.add(
        "show"
    );


    /*
     * 음악 위치와 영상 위치 맞추기
     */

    if (
        video.readyState >= 1
    ) {

        try {

            video.currentTime =
                audio.currentTime;

        } catch (error) {

            console.error(
                "영상 위치 변경 실패:",
                error
            );

        }

    }


    /*
     * 영상 표시
     */

    video.classList.add(
        "active"
    );


    /*
     * 영상 재생
     */

    video.play()
        .then(() => {

            /*
             * 영상이 정상적으로 재생되었을 때
             */

            video.classList.add(
                "active"
            );

            background.classList.add(
                "show"
            );

        })
        .catch(
            error => {

                console.error(
                    "배경 영상 재생 실패:",
                    error
                );

            }
        );

}


/* ==========================================
   Playlist
========================================== */

function renderPlaylist() {

    playlist.innerHTML = "";


    songs.forEach(
        (song, index) => {

            const item =
                document.createElement("li");


            item.className =
                "song";


            if (
                index === currentIndex
            ) {

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <span class="number">
                    ${index + 1}
                </span>

                <span class="song-name">
                    ${song.title}
                </span>

            `;


            item.addEventListener(
                "click",
                () => {

                    loadSong(index);

                }
            );


            playlist.appendChild(
                item
            );

        }
    );

}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {

    currentIndex =
        index;


    const song =
        songs[currentIndex];


    /*
     * 기존 음악 정지
     */

    audio.pause();


    /*
     * 기존 배경 정지
     */

    hideAllBackgrounds();


    /*
     * 음악 변경
     */

    audio.src =
        song.file;

    audio.load();


    /*
     * 제목 변경
     */

    songTitle.textContent =
        song.title;


    songArtist.textContent =
        song.artist;


    /*
     * Playlist 갱신
     */

    renderPlaylist();


    /*
     * 음악 재생
     */

    audio.play()
        .then(() => {

            /*
             * 현재 곡에 배경이 있는 경우
             */

            if (
                song.background !== null
            ) {

                startBackground();

            }

        })
        .catch(
            error => {

                console.error(
                    "음악 재생 실패:",
                    error
                );

            }
        );

}


/* ==========================================
   음악 재생 이벤트
========================================== */

audio.addEventListener(
    "play",
    () => {

        const song =
            songs[currentIndex];


        if (
            song.background !== null
        ) {

            startBackground();

        } else {

            hideAllBackgrounds();

        }

    }
);


/* ==========================================
   음악 일시정지
========================================== */

audio.addEventListener(
    "pause",
    () => {

        const video =
            getBackgroundVideo();


        if (video) {

            video.pause();

        }

    }
);


/* ==========================================
   음악 / 영상 싱크
========================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        const video =
            getBackgroundVideo();


        if (!video) {

            return;

        }


        if (
            video.readyState < 2
        ) {

            return;

        }


        const difference =
            Math.abs(
                video.currentTime -
                audio.currentTime
            );


        if (
            difference > 0.35
        ) {

            try {

                video.currentTime =
                    audio.currentTime;

            } catch (error) {}

        }

    }
);


/* ==========================================
   음악 위치 이동
========================================== */

audio.addEventListener(
    "seeking",
    () => {

        const video =
            getBackgroundVideo();


        if (!video) {

            return;

        }


        try {

            video.currentTime =
                audio.currentTime;

        } catch (error) {}

    }
);


/* ==========================================
   음악 종료
========================================== */

audio.addEventListener(
    "ended",
    () => {

        const next =
            (
                currentIndex + 1
            ) % songs.length;


        loadSong(next);

    }
);


/* ==========================================
   배경 영상 1 로딩 완료
========================================== */

backgroundVideo1.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background === 1 &&
            !audio.paused
        ) {

            startBackground();

        }

    }
);


/* ==========================================
   배경 영상 2 로딩 완료
========================================== */

backgroundVideo2.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background === 2 &&
            !audio.paused
        ) {

            startBackground();

        }

    }
);


/* ==========================================
   배경 영상 1 오류
========================================== */

backgroundVideo1.addEventListener(
    "error",
    () => {

        console.error(
            "3번 배경 영상 로딩 실패:",
            backgroundVideo1.error
        );

    }
);


/* ==========================================
   배경 영상 2 오류
========================================== */

backgroundVideo2.addEventListener(
    "error",
    () => {

        console.error(
            "4번 배경 영상 로딩 실패:",
            backgroundVideo2.error
        );

    }
);


/* ==========================================
   초기화
========================================== */

renderPlaylist();

loadSong(0);


</script>

</body>
</html>
