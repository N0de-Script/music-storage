<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N0DE SOUNDS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: #f8fafc;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;

      overflow: hidden;

      background: #0f172a;
    }

    /* ========================================
       배경 영상
    ======================================== */

    .bg-video-container {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      z-index: 1;

      overflow: hidden;

      background: #0f172a;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    .bg-video-container.show {
      opacity: 1;
      visibility: visible;
    }

    .bg-video-container video {
      width: 100%;
      height: 100%;

      object-fit: cover;

      filter:
        blur(30px)
        brightness(0.5);

      transform: scale(1.15);

      pointer-events: none;
    }

    /* ========================================
       배경 오버레이
    ======================================== */

    .overlay {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      z-index: 2;

      background:
        rgba(15, 23, 42, 0.4);

      pointer-events: none;
    }

    /* ========================================
       플레이어
    ======================================== */

    .player-container {
      position: relative;

      z-index: 3;

      width: calc(100% - 30px);

      max-width: 420px;

      padding: 28px;

      background:
        rgba(30, 41, 59, 0.75);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      border:
        1px solid
        rgba(255, 255, 255, 0.15);

      border-radius: 24px;

      box-shadow:
        0 25px 50px -12px
        rgba(0, 0, 0, 0.6);
    }

    /* ========================================
       현재 재생 영역
    ======================================== */

    .now-playing {
      text-align: center;

      margin-bottom: 20px;
    }

    .album-art {
      width: 100%;
      height: 180px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.02)
        );

      border-radius: 16px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 56px;

      margin-bottom: 16px;

      border:
        1px solid
        rgba(255,255,255,0.1);

      user-select: none;
    }

    .song-title {
      font-size: 18px;

      font-weight: 700;

      margin-bottom: 4px;

      word-break: break-word;

      line-height: 1.4;
    }

    .artist {
      font-size: 14px;

      color: #cbd5e1;

      margin-bottom: 16px;
    }

    /* ========================================
       오디오
    ======================================== */

    audio {
      width: 100%;

      margin-bottom: 20px;

      filter:
        invert(0.9)
        hue-rotate(180deg);
    }

    /* ========================================
       플레이리스트 제목
    ======================================== */

    .playlist-title {
      font-size: 12px;

      font-weight: 700;

      color: #94a3b8;

      margin-bottom: 10px;

      text-transform: uppercase;

      letter-spacing: 0.05em;
    }

    /* ========================================
       플레이리스트
    ======================================== */

    .playlist {
      list-style: none;

      max-height: 200px;

      overflow-y: auto;

      border-radius: 12px;

      background:
        rgba(15, 23, 42, 0.6);

      scrollbar-width: thin;
    }

    .playlist::-webkit-scrollbar {
      width: 5px;
    }

    .playlist::-webkit-scrollbar-thumb {
      background:
        rgba(255,255,255,0.2);

      border-radius: 10px;
    }

    /* ========================================
       플레이리스트 아이템
    ======================================== */

    .playlist-item {
      padding: 12px 16px;

      font-size: 13px;

      border-bottom:
        1px solid
        rgba(255,255,255,0.05);

      cursor: pointer;

      display: flex;

      align-items: center;

      gap: 10px;

      transition:
        background 0.2s ease,
        transform 0.15s ease;
    }

    .playlist-item:last-child {
      border-bottom: none;
    }

    .playlist-item:hover {
      background:
        rgba(255,255,255,0.1);

      transform:
        translateX(2px);
    }

    .playlist-item.active {
      background:
        rgba(99,102,241,0.35);

      color: #a5b4fc;

      font-weight: 600;
    }

    .playlist-number {
      width: 20px;

      min-width: 20px;

      text-align: center;

      opacity: 0.7;
    }

    .playlist-name {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    /* ========================================
       모바일
    ======================================== */

    @media (max-width: 500px) {

      .player-container {
        padding: 20px;

        border-radius: 20px;
      }

      .album-art {
        height: 150px;

        font-size: 48px;
      }

      .song-title {
        font-size: 16px;
      }

      .playlist {
        max-height: 180px;
      }

    }
  </style>
</head>

<body>

  <!-- ========================================
       i told u v1 전용 배경 영상
  ======================================== -->

  <div
    class="bg-video-container"
    id="bg-video-container"
  >

    <video
      id="bg-video"
      src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/bg.mp4"
      loop
      muted
      playsinline
      preload="auto">
    </video>

  </div>

  <div class="overlay"></div>


  <!-- ========================================
       음악 플레이어
  ======================================== -->

  <div class="player-container">

    <div class="now-playing">

      <div class="album-art">
        🎧
      </div>

      <div
        class="song-title"
        id="current-title">
        곡을 선택해주세요
      </div>

      <div
        class="artist"
        id="current-artist">
        N0DE SOUNDS
      </div>

      <audio
        id="audio-player"
        controls
        preload="metadata">
      </audio>

    </div>


    <div class="playlist-title">
      Playlist
    </div>

    <ul
      class="playlist"
      id="playlist">
    </ul>

  </div>


  <script>

    /* ========================================
       음악 목록
       
       중요:
       MP3들은 index.html과 같은
       music-storage 저장소에 있으므로
       상대경로로 불러옵니다.
    ======================================== */

    const songs = [

      {
        title: "NUMBER TWERKNATION28",
        artist: "sped up / nightcore",

        audioSrc:
          "./NUMBER%20TWERKNATION28%20(sped%20upnightcore).mp3",

        hasBackground: false
      },


      {
        title: "BrooklynBloodPop!",
        artist: "Nightcore",

        audioSrc:
          "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        hasBackground: false
      },


      {
        title: "i told u v1",
        artist: "midwxst",

        audioSrc:
          "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        hasBackground: true
      },


      {
        title: "너",
        artist: "ycs",

        audioSrc:
          "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        hasBackground: false
      },


      {
        title: "relations",
        artist: "이상형",

        audioSrc:
          "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        hasBackground: false
      }

    ];


    /* ========================================
       요소
    ======================================== */

    const audioPlayer =
      document.getElementById(
        "audio-player"
      );

    const bgVideo =
      document.getElementById(
        "bg-video"
      );

    const bgVideoContainer =
      document.getElementById(
        "bg-video-container"
      );

    const currentTitle =
      document.getElementById(
        "current-title"
      );

    const currentArtist =
      document.getElementById(
        "current-artist"
      );

    const playlistElement =
      document.getElementById(
        "playlist"
      );


    /* ========================================
       현재 곡
    ======================================== */

    let currentIndex = 0;


    /* ========================================
       배경 영상 표시 여부
    ======================================== */

    function updateBackground() {

      const song =
        songs[currentIndex];


      if (song.hasBackground) {

        /*
         * i told u v1
         * 배경 영상 표시
         */

        bgVideoContainer.classList.add(
          "show"
        );

      } else {

        /*
         * 다른 곡
         * 배경 영상 제거
         */

        bgVideoContainer.classList.remove(
          "show"
        );

        bgVideo.pause();

        bgVideo.currentTime = 0;

      }

    }


    /* ========================================
       플레이리스트 생성
    ======================================== */

    function renderPlaylist() {

      playlistElement.innerHTML = "";


      songs.forEach(
        (song, index) => {

          const li =
            document.createElement(
              "li"
            );


          li.className =
            "playlist-item" +
            (
              index === currentIndex
                ? " active"
                : ""
            );


          li.innerHTML = `

            <span class="playlist-number">
              ${index + 1}
            </span>

            <span class="playlist-name">
              ${song.title}
            </span>

          `;


          li.addEventListener(
            "click",
            () => {

              loadSong(
                index,
                true
              );

            }
          );


          playlistElement.appendChild(
            li
          );

        }
      );

    }


    /* ========================================
       곡 불러오기
    ======================================== */

    function loadSong(
      index,
      shouldPlay = false
    ) {

      currentIndex = index;

      const song =
        songs[currentIndex];


      /*
       * 현재 곡 정보
       */

      currentTitle.textContent =
        song.title;

      currentArtist.textContent =
        song.artist;


      /*
       * 배경 영상 변경
       */

      updateBackground();


      /*
       * 기존 음악 완전히 정지
       */

      audioPlayer.pause();

      audioPlayer.removeAttribute(
        "src"
      );

      audioPlayer.load();


      /*
       * 새 음악 주소 설정
       */

      audioPlayer.src =
        song.audioSrc;


      /*
       * 브라우저에 로드 요청
       */

      audioPlayer.load();


      /*
       * 플레이리스트 업데이트
       */

      renderPlaylist();


      /*
       * 재생 버튼을 눌러 곡을 선택한 경우
       */

      if (shouldPlay) {

        playCurrentSong();

      }

    }


    /* ========================================
       현재 곡 재생
    ======================================== */

    function playCurrentSong() {

      const song =
        songs[currentIndex];


      audioPlayer.play()
        .then(() => {

          /*
           * i told u v1일 때만
           * 배경 영상 재생
           */

          if (song.hasBackground) {

            bgVideo.play()
              .catch(() => {});

          }

        })
        .catch((error) => {

          console.log(
            "음악 자동재생이 브라우저에 의해 차단되었습니다.",
            error
          );

        });

    }


    /* ========================================
       음악 재생 이벤트
    ======================================== */

    audioPlayer.addEventListener(
      "play",
      () => {

        const song =
          songs[currentIndex];


        if (song.hasBackground) {

          bgVideo.play()
            .catch(() => {});

        } else {

          bgVideo.pause();

        }

      }
    );


    /* ========================================
       음악 일시정지
    ======================================== */

    audioPlayer.addEventListener(
      "pause",
      () => {

        bgVideo.pause();

      }
    );


    /* ========================================
       음악과 영상 싱크
    ======================================== */

    audioPlayer.addEventListener(
      "timeupdate",
      () => {

        const song =
          songs[currentIndex];


        /*
         * i told u v1이 아니면
         * 영상 싱크를 사용하지 않음
         */

        if (!song.hasBackground) {
          return;
        }


        /*
         * 음악과 영상의 현재 시간
         */

        const musicTime =
          audioPlayer.currentTime;

        const videoTime =
          bgVideo.currentTime;


        const difference =
          Math.abs(
            musicTime - videoTime
          );


        /*
         * 0.5초 이상 차이나면
         * 영상 시간을 음악에 맞춤
         */

        if (difference > 0.5) {

          try {

            bgVideo.currentTime =
              musicTime;

          } catch (error) {

            console.log(
              "배경 영상 싱크 조정 실패",
              error
            );

          }

        }

      }
    );


    /* ========================================
       곡 종료
    ======================================== */

    audioPlayer.addEventListener(
      "ended",
      () => {

        /*
         * 현재 배경 영상 정지
         */

        bgVideo.pause();

        bgVideo.currentTime = 0;


        /*
         * 다음 곡으로 이동
         */

        currentIndex =
          (
            currentIndex + 1
          ) % songs.length;


        /*
         * 다음 곡 재생
         */

        loadSong(
          currentIndex,
          true
        );

      }
    );


    /* ========================================
       음악 로딩 오류
    ======================================== */

    audioPlayer.addEventListener(
      "error",
      () => {

        const song =
          songs[currentIndex];


        console.error(
          "음악 파일을 불러오지 못했습니다:",
          song.audioSrc
        );

      }
    );


    /* ========================================
       배경 영상 오류
    ======================================== */

    bgVideo.addEventListener(
      "error",
      () => {

        console.error(
          "bg.mp4를 불러오지 못했습니다."
        );

      }
    );


    /* ========================================
       초기화
    ======================================== */

    renderPlaylist();


    loadSong(
      0,
      false
    );

  </script>

</body>
</html>
