* {

html,
body {
    width: 100%;

}

body {
    font-family:
        Arial,

        sans-serif;

    background: #10131a;
    color: white;

    min-height: 100vh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* ==========================================
   배경 컨테이너
========================================== */

#backgroundContainer {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;

    overflow: hidden;

    background: #10131a;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.5s ease,
        visibility 0.5s ease;

    pointer-events: none;
}


#backgroundContainer.show {

    opacity: 1;

    visibility: visible;
}


/* ==========================================
   모든 배경 미디어
========================================== */

.background-media {

    position: absolute;

    inset: -4%;

    width: 108%;

    height: 108%;

    object-fit: cover;

    display: block;

    opacity: 0;

    visibility: hidden;

    filter:
        blur(10px)
        brightness(0.48);

    transform: scale(1.03);

    transition:
        opacity 0.5s ease,
        visibility 0.5s ease;

    pointer-events: none;
}


.background-media.active {

    opacity: 1;

    visibility: visible;
}


/* ==========================================
   배경 오버레이
========================================== */

#backgroundOverlay {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1;

    background:
        rgba(0, 0, 0, 0.25);

    pointer-events: none;
}


/* ==========================================
   플레이어
========================================== */

.player {

    z-index: 10;

    width: calc(100% - 30px);

    max-width: 430px;

    padding: 28px;

    border-radius: 24px;

    background:
        rgba(20, 25, 35, 0.82);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    border:
        1px solid
        rgba(255, 255, 255, 0.15);

    box-shadow:
        0 25px 60px

}

   앨범

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 60px;

    margin-bottom: 18px;

    background:
        rgba(255, 255, 255, 0.06);

    border:
        1px solid
        rgba(255, 255, 255, 0.1);
}


/* ==========================================
   제목
========================================== */

.title {

    text-align: center;

}


.artist {

}

   오디오
========================================== */

audio {

    width: 100%;

    margin-bottom: 22px;
}


/* ==========================================
   Playlist
========================================== */

.playlist-title {

    font-size: 12px;

    color: #94a3b8;

    font-weight: 700;

    letter-spacing: 0.08em;

    margin-bottom: 10px;
}


.playlist {

}


.song {

.number {

/* ==========================================
   모바일

@media (max-width: 500px) {

    .player {

        padding: 20px;

}

            src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_Media_TiOpGgCXeT0_001_480p%20%281%29.mp4"

     플레이어

</div>


<script>

/* ==========================================
   요소
========================================== */

const audio =
    document.getElementById("audio");

const backgroundContainer =
    document.getElementById("backgroundContainer");

const backgroundNumber =
    document.getElementById("backgroundNumber");

const backgroundVideo1 =
    document.getElementById("backgroundVideo1");

const backgroundVideo2 =
    document.getElementById("backgroundVideo2");

const backgroundRelations =
    document.getElementById("backgroundRelations");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playlist =
    document.getElementById("playlist");


let currentIndex = 0;


/* ==========================================
   음악 데이터
========================================== */

const songs = [

    /* 1번 */

    {
        title:
            "NUMBER TWERKNATION28",

        artist:
            "sped up / nightcore",

        file:
            "./NUMBER%20TWERKNATION28%20(sped%20upnightcore).mp3",

        background:
            "number"
    },


    /* 2번 */

    {
        title:
            "BrooklynBloodPop!",

        artist:
            "Nightcore",

        file:
            "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        background:
            null
    },


    /* 3번 */

    {
        title:
            "i told u v1",

        artist:
            "midwxst",

        file:
            "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        background:
            "video1"
    },


    /* 4번 */

    {
        title:
            "너",

        artist:
            "ycs",

        file:
            "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        background:
            "video2"
    },


    /* 5번 */

    {
        title:
            "relations",

        artist:
            "이상형",

        file:
            "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        background:
            "relations"
    }

];


/* ==========================================
   현재 배경 가져오기
========================================== */

function getCurrentBackground() {

    const type =
        songs[currentIndex].background;


    if (type === "number") {

        return backgroundNumber;

    }


    if (type === "video1") {

        return backgroundVideo1;

    }


    if (type === "video2") {

        return backgroundVideo2;

    }


    if (type === "relations") {

        return backgroundRelations;

    }


    return null;

}


/* ==========================================
   모든 배경 완전 초기화
========================================== */

function clearBackgrounds() {

    backgroundNumber.pause();

    backgroundVideo1.pause();

    backgroundVideo2.pause();


    backgroundNumber.classList.remove(
        "active"
    );

    backgroundVideo1.classList.remove(
        "active"
    );

    backgroundVideo2.classList.remove(
        "active"
    );

    backgroundRelations.classList.remove(
        "active"
    );


    backgroundContainer.classList.remove(
        "show"
    );

}


/* ==========================================
   배경 표시
========================================== */

function showBackground() {

    const media =
        getCurrentBackground();


    /*
     * 배경이 없는 곡
     */

    if (!media) {

        clearBackgrounds();

        return;

    }


    /*
     * 기존 배경 제거
     */

    clearBackgrounds();


    /*
     * 새 배경 컨테이너 표시
     */

    backgroundContainer.classList.add(
        "show"
    );


    /*
     * JPG 배경
     */

    if (
        media === backgroundRelations
    ) {

        media.classList.add(
            "active"
        );

        return;

    }


    /*
     * MP4 배경
     */

    media.classList.add(
        "active"
    );


    /*
     * 음악과 영상 위치 맞추기
     */

    try {

        if (
            media.readyState >= 1
        ) {

            media.currentTime =
                audio.currentTime;

        }

    } catch (error) {

        console.error(
            "배경 위치 동기화 실패:",
            error
        );

    }


    /*
     * 영상 재생
     */

    media.play()
        .then(() => {

            if (
                getCurrentBackground() === media &&
                !audio.paused
            ) {

                media.classList.add(
                    "active"
                );

                backgroundContainer.classList.add(
                    "show"
                );

            }

        })
        .catch(
            error => {

                console.error(
                    "배경 영상 재생 실패:",
                    error
                );

            }
        );

}


/* ==========================================
   Playlist
========================================== */

function renderPlaylist() {

    playlist.innerHTML = "";


    songs.forEach(
        (song, index) => {

            const item =
                document.createElement("li");


            item.className =
                "song";


            if (
                index === currentIndex
            ) {

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <span class="number">
                    ${index + 1}
                </span>

                <span class="song-name">
                    ${song.title}
                </span>

            `;


            item.addEventListener(
                "click",
                () => {

                    loadSong(index);

                }
            );


            playlist.appendChild(
                item
            );

        }
    );

}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {

    currentIndex =
        index;


    const song =
        songs[currentIndex];


    /*
     * 기존 음악 정지
     */

    audio.pause();


    /*
     * 기존 배경 제거
     */

    clearBackgrounds();


    /*
     * 음악 변경
     */

    audio.src =
        song.file;

    audio.load();


    /*
     * 곡 정보 변경
     */

    songTitle.textContent =
        song.title;


    songArtist.textContent =
        song.artist;


    /*
     * Playlist 갱신
     */

    renderPlaylist();


    /*
     * 음악 재생
     */

    audio.play()
        .then(() => {

            if (
                songs[currentIndex].background
            ) {

                showBackground();

            }

        })
        .catch(
            error => {

                console.error(
                    "음악 재생 실패:",
                    error
                );

            }
        );

}


/* ==========================================
   음악 재생 이벤트
========================================== */

audio.addEventListener(
    "play",
    () => {

        const song =
            songs[currentIndex];


        if (
            song.background
        ) {

            showBackground();

        } else {

            clearBackgrounds();

        }

    }
);


/* ==========================================
   음악 일시정지
========================================== */

audio.addEventListener(
    "pause",
    () => {

        const media =
            getCurrentBackground();


        if (
            media &&
            media.tagName === "VIDEO"
        ) {

            media.pause();

        }

    }
);


/* ==========================================
   음악 / 영상 싱크
========================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        const media =
            getCurrentBackground();


        /*
         * 영상 배경이 아니면 종료
         */

        if (
            !media ||
            media.tagName !== "VIDEO"
        ) {

            return;

        }


        if (
            media.readyState < 2
        ) {

            return;

        }


        const difference =
            Math.abs(
                media.currentTime -
                audio.currentTime
            );


        if (
            difference > 0.35
        ) {

            try {

                media.currentTime =
                    audio.currentTime;

            } catch (error) {}

        }

    }
);


/* ==========================================
   음악 위치 이동
========================================== */

audio.addEventListener(
    "seeking",
    () => {

        const media =
            getCurrentBackground();


        if (
            !media ||
            media.tagName !== "VIDEO"
        ) {

            return;

        }


        try {

            media.currentTime =
                audio.currentTime;

        } catch (error) {}

    }
);


/* ==========================================
   음악 종료
========================================== */

audio.addEventListener(
    "ended",
    () => {

        const next =
            (
                currentIndex + 1
            ) % songs.length;


        loadSong(next);

    }
);


/* ==========================================
   1번 배경 로딩 완료
========================================== */

backgroundNumber.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background === "number" &&
            !audio.paused
        ) {

            showBackground();

        }

    }
);


/* ==========================================
   3번 배경 로딩 완료
========================================== */

backgroundVideo1.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background === "video1" &&
            !audio.paused
        ) {

            showBackground();

        }

    }
);


/* ==========================================
   4번 배경 로딩 완료
========================================== */

backgroundVideo2.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background === "video2" &&
            !audio.paused
        ) {

            showBackground();

        }

    }
);


/* ==========================================
   1번 배경 오류
========================================== */

backgroundNumber.addEventListener(
    "error",
    () => {

        console.error(
            "NUMBER 배경 MP4 로딩 실패:",
            backgroundNumber.error
        );

    }
);


/* ==========================================
   3번 배경 오류
========================================== */

backgroundVideo1.addEventListener(
    "error",
    () => {

        console.error(
            "3번 배경 MP4 로딩 실패:",
            backgroundVideo1.error
        );

    }
);


/* ==========================================
   4번 배경 오류
========================================== */

backgroundVideo2.addEventListener(
    "error",
    () => {

        console.error(
            "4번 배경 MP4 로딩 실패:",
            backgroundVideo2.error
        );

    }
);


/* ==========================================
   JPG 오류
========================================== */

backgroundRelations.addEventListener(
    "error",
    () => {

        console.error(
            "relations JPG 배경 로딩 실패"
        );

    }
);


/* ==========================================
   초기화
========================================== */

renderPlaylist();

loadSong(0);

</script>

</body>
</html>
