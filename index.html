<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>N0DE SOUNDS</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      height: 100%;
    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #0f172a;

      color: white;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

    }


    /* =========================================
       배경 영상
    ========================================= */

    #background {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      z-index: 0;

      overflow: hidden;

      background: #0f172a;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;

    }


    #background.active {

      opacity: 1;

      visibility: visible;

    }


    #background video {

      position: absolute;

      top: 50%;
      left: 50%;

      width: 100%;
      height: 100%;

      transform:
        translate(-50%, -50%)
        scale(1.08);

      object-fit: cover;

      filter:
        brightness(0.5)
        blur(12px);

    }


    /* =========================================
       배경 어두운 오버레이
    ========================================= */

    #background-overlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      z-index: 1;

      pointer-events: none;

      background:
        rgba(0, 0, 0, 0.25);

    }


    /* =========================================
       플레이어
    ========================================= */

    .player {

      position: relative;

      z-index: 10;

      width: calc(100% - 30px);

      max-width: 430px;

      padding: 28px;

      border-radius: 24px;

      background:
        rgba(20, 25, 35, 0.78);

      border:
        1px solid
        rgba(255,255,255,0.15);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:
        0 25px 70px
        rgba(0,0,0,0.55);

    }


    /* =========================================
       앨범 영역
    ========================================= */

    .album {

      width: 100%;

      height: 190px;

      border-radius: 18px;

      display: flex;

      justify-content: center;

      align-items: center;

      font-size: 65px;

      margin-bottom: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.10),
          rgba(255,255,255,0.025)
        );

      border:
        1px solid
        rgba(255,255,255,0.1);

    }


    /* =========================================
       곡 정보
    ========================================= */

    .title {

      font-size: 19px;

      font-weight: 700;

      text-align: center;

      line-height: 1.4;

      word-break: break-word;

    }


    .artist {

      margin-top: 5px;

      margin-bottom: 18px;

      font-size: 14px;

      text-align: center;

      color: #b7c0ce;

    }


    /* =========================================
       오디오
    ========================================= */

    audio {

      display: block;

      width: 100%;

      margin-bottom: 22px;

    }


    /* =========================================
       플레이리스트 제목
    ========================================= */

    .playlist-label {

      font-size: 12px;

      font-weight: 700;

      color: #94a3b8;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      margin-bottom: 10px;

    }


    /* =========================================
       플레이리스트
    ========================================= */

    .playlist {

      width: 100%;

      max-height: 210px;

      overflow-y: auto;

      list-style: none;

      border-radius: 14px;

      background:
        rgba(0,0,0,0.20);

    }


    .playlist::-webkit-scrollbar {

      width: 5px;

    }


    .playlist::-webkit-scrollbar-thumb {

      background:
        rgba(255,255,255,0.2);

      border-radius: 20px;

    }


    /* =========================================
       곡
    ========================================= */

    .song {

      width: 100%;

      padding: 13px 15px;

      display: flex;

      align-items: center;

      gap: 11px;

      cursor: pointer;

      border-bottom:
        1px solid
        rgba(255,255,255,0.05);

      transition:
        background 0.2s ease,
        transform 0.15s ease;

    }


    .song:last-child {

      border-bottom: none;

    }


    .song:hover {

      background:
        rgba(255,255,255,0.08);

      transform:
        translateX(2px);

    }


    .song.active {

      background:
        rgba(99,102,241,0.30);

    }


    .number {

      width: 22px;

      min-width: 22px;

      text-align: center;

      font-size: 12px;

      color: #94a3b8;

    }


    .song.active .number {

      color: #a5b4fc;

    }


    .song-name {

      flex: 1;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      font-size: 13px;

    }


    /* =========================================
       모바일
    ========================================= */

    @media (max-width: 500px) {

      .player {

        padding: 20px;

        border-radius: 20px;

      }


      .album {

        height: 150px;

        font-size: 50px;

      }


      .title {

        font-size: 17px;

      }


      .playlist {

        max-height: 180px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       배경 영상
  ========================================= -->

  <div id="background">

    <video
      id="backgroundVideo"
      src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/bg.mp4"
      muted
      loop
      playsinline
      preload="auto">
    </video>

  </div>


  <div id="background-overlay"></div>


  <!-- =========================================
       음악 플레이어
  ========================================= -->

  <div class="player">


    <div class="album">

      🎧

    </div>


    <div
      class="title"
      id="songTitle">

      곡을 선택해주세요

    </div>


    <div
      class="artist"
      id="songArtist">

      N0DE SOUNDS

    </div>


    <audio
      id="audio"
      controls
      preload="metadata">
    </audio>


    <div class="playlist-label">

      Playlist

    </div>


    <ul
      class="playlist"
      id="playlist">
    </ul>


  </div>


  <script>


    /* =========================================
       음악 목록
    ========================================= */

    const songs = [

      {

        title:
          "NUMBER TWERKNATION28",

        artist:
          "sped up / nightcore",

        file:
          "./NUMBER%20TWERKNATION28%20(sped%20upnightcore).mp3",

        background:
          false

      },


      {

        title:
          "BrooklynBloodPop!",

        artist:
          "Nightcore",

        file:
          "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        background:
          false

      },


      {

        title:
          "i told u v1",

        artist:
          "midwxst",

        file:
          "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        background:
          true

      },


      {

        title:
          "너",

        artist:
          "ycs",

        file:
          "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        background:
          false

      },


      {

        title:
          "relations",

        artist:
          "이상형",

        file:
          "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        background:
          false

      }

    ];


    /* =========================================
       요소
    ========================================= */

    const audio =
      document.getElementById("audio");


    const background =
      document.getElementById("background");


    const backgroundVideo =
      document.getElementById(
        "backgroundVideo"
      );


    const songTitle =
      document.getElementById("songTitle");


    const songArtist =
      document.getElementById("songArtist");


    const playlist =
      document.getElementById("playlist");


    /* =========================================
       현재 곡
    ========================================= */

    let currentIndex = 0;


    /* =========================================
       플레이리스트 생성
    ========================================= */

    function renderPlaylist() {

      playlist.innerHTML = "";


      songs.forEach(
        (song, index) => {

          const item =
            document.createElement("li");


          item.className =
            "song";


          if (
            index === currentIndex
          ) {

            item.classList.add(
              "active"
            );

          }


          item.innerHTML = `

            <span class="number">
              ${index + 1}
            </span>

            <span class="song-name">
              ${song.title}
            </span>

          `;


          item.addEventListener(
            "click",
            () => {

              changeSong(
                index,
                true
              );

            }
          );


          playlist.appendChild(item);

        }
      );

    }


    /* =========================================
       배경 영상 끄기
    ========================================= */

    function hideBackground() {

      background.classList.remove(
        "active"
      );


      backgroundVideo.pause();


      /*
       * 영상 위치를 처음으로 돌림
       */

      try {

        backgroundVideo.currentTime = 0;

      } catch (error) {}

    }


    /* =========================================
       배경 영상 표시
    ========================================= */

    function showBackground() {

      background.classList.add(
        "active"
      );

    }


    /* =========================================
       현재 곡의 배경 처리
    ========================================= */

    function updateBackground() {

      const song =
        songs[currentIndex];


      if (
        song.background === true
      ) {

        /*
         * i told u v1
         */

        showBackground();

      } else {

        /*
         * 나머지 곡
         */

        hideBackground();

      }

    }


    /* =========================================
       곡 변경
    ========================================= */

    function changeSong(
      index,
      autoPlay = false
    ) {

      currentIndex = index;


      const song =
        songs[currentIndex];


      /*
       * 음악 정지
       */

      audio.pause();


      /*
       * 배경 먼저 변경
       */

      updateBackground();


      /*
       * 음악 주소 변경
       */

      audio.src =
        song.file;


      /*
       * 브라우저에 로드
       */

      audio.load();


      /*
       * 정보 변경
       */

      songTitle.textContent =
        song.title;


      songArtist.textContent =
        song.artist;


      /*
       * 리스트 업데이트
       */

      renderPlaylist();


      /*
       * 재생
       */

      if (autoPlay) {

        playSong();

      }

    }


    /* =========================================
       현재 음악 재생
    ========================================= */

    function playSong() {

      const song =
        songs[currentIndex];


      audio.play()
        .then(() => {

          /*
           * i told u v1일 경우
           * 배경 영상도 재생
           */

          if (
            song.background === true
          ) {

            startBackgroundVideo();

          }

        })
        .catch(
          (error) => {

            console.log(
              "음악 재생 실패:",
              error
            );

          }
        );

    }


    /* =========================================
       배경 영상 시작
    ========================================= */

    function startBackgroundVideo() {

      /*
       * 현재 음악 시간과
       * 영상 시간을 맞춤
       */

      try {

        backgroundVideo.currentTime =
          audio.currentTime;

      } catch (error) {}


      /*
       * 영상 재생
       */

      backgroundVideo
        .play()
        .catch(
          (error) => {

            console.log(
              "배경 영상 재생 실패:",
              error
            );

          }
        );

    }


    /* =========================================
       음악 PLAY
    ========================================= */

    audio.addEventListener(
      "play",
      () => {

        const song =
          songs[currentIndex];


        if (
          song.background === true
        ) {

          showBackground();

          startBackgroundVideo();

        } else {

          hideBackground();

        }

      }
    );


    /* =========================================
       음악 PAUSE
    ========================================= */

    audio.addEventListener(
      "pause",
      () => {

        backgroundVideo.pause();

      }
    );


    /* =========================================
       음악 시간 변경
    ========================================= */

    audio.addEventListener(
      "timeupdate",
      () => {

        const song =
          songs[currentIndex];


        /*
         * i told u v1만 싱크
         */

        if (
          song.background !== true
        ) {

          return;

        }


        if (
          backgroundVideo.readyState < 2
        ) {

          return;

        }


        const musicTime =
          audio.currentTime;


        const videoTime =
          backgroundVideo.currentTime;


        const difference =
          Math.abs(
            musicTime -
            videoTime
          );


        /*
         * 0.3초 이상 차이나면
         * 영상 시간 보정
         */

        if (
          difference > 0.3
        ) {

          try {

            backgroundVideo.currentTime =
              musicTime;

          } catch (error) {}

        }

      }
    );


    /* =========================================
       곡 종료
    ========================================= */

    audio.addEventListener(
      "ended",
      () => {

        /*
         * 다음 곡
         */

        const nextIndex =
          (
            currentIndex + 1
          ) % songs.length;


        changeSong(
          nextIndex,
          true
        );

      }
    );


    /* =========================================
       배경 영상 로딩 완료
    ========================================= */

    backgroundVideo.addEventListener(
      "loadedmetadata",
      () => {

        const song =
          songs[currentIndex];


        if (
          song.background === true &&
          !audio.paused
        ) {

          try {

            backgroundVideo.currentTime =
              audio.currentTime;

          } catch (error) {}


          backgroundVideo
            .play()
            .catch(
              () => {}
            );

        }

      }
    );


    /* =========================================
       배경 영상 오류 확인
    ========================================= */

    backgroundVideo.addEventListener(
      "error",
      () => {

        console.error(
          "bg.mp4 로딩 오류"
        );

      }
    );


    /* =========================================
       초기화
    ========================================= */

    renderPlaylist();


    changeSong(
      0,
      false
    );


  </script>

</body>
</html>
