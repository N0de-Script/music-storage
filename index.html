<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N0DE SOUNDS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Arial,
        "Segoe UI",
        sans-serif;

    background: #10131a;
    color: white;

    min-height: 100vh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* ==========================================
   배경
========================================== */

#videoBackground {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;

    overflow: hidden;

    background: #10131a;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.5s ease,
        visibility 0.5s ease;

    pointer-events: none;
}


#videoBackground.show {

    opacity: 1;

    visibility: visible;
}


/* ==========================================
   배경 영상
========================================== */

.background-video {

    position: absolute;

    top: -4%;
    left: -4%;

    width: 108%;
    height: 108%;

    object-fit: cover;

    display: block;

    filter:
        blur(10px)
        brightness(0.48);

    transform: scale(1.03);

    opacity: 0;

    transition:
        opacity 0.5s ease;

    pointer-events: none;
}


.background-video.active {

    opacity: 1;
}


/* ==========================================
   배경 이미지 / GIF
========================================== */

.background-image {

    position: absolute;

    inset: -4%;

    width: 108%;
    height: 108%;

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    filter:
        blur(10px)
        brightness(0.48);

    transform: scale(1.03);

    opacity: 0;

    transition:
        opacity 0.5s ease;

    pointer-events: none;
}


.background-image.active {

    opacity: 1;
}


/* ==========================================
   배경 오버레이
========================================== */

#videoOverlay {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1;

    pointer-events: none;

    background:
        rgba(0, 0, 0, 0.25);
}


/* ==========================================
   플레이어
========================================== */

.player {

    position: relative;

    z-index: 10;

    width: calc(100% - 30px);

    max-width: 430px;

    padding: 28px;

    border-radius: 24px;

    background:
        rgba(20, 25, 35, 0.82);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    border:
        1px solid
        rgba(255, 255, 255, 0.15);

    box-shadow:
        0 25px 60px
        rgba(0, 0, 0, 0.6);
}


/* ==========================================
   앨범
========================================== */

.album {

    width: 100%;
    height: 180px;

    border-radius: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 60px;

    margin-bottom: 18px;

    background:
        rgba(255, 255, 255, 0.06);

    border:
        1px solid
        rgba(255, 255, 255, 0.1);
}


/* ==========================================
   제목
========================================== */

.title {

    text-align: center;

    font-size: 19px;

    font-weight: 700;

    line-height: 1.4;

    word-break: break-word;
}


.artist {

    text-align: center;

    margin-top: 5px;

    margin-bottom: 18px;

    color: #aeb8c7;

    font-size: 14px;
}


/* ==========================================
   오디오
========================================== */

audio {

    width: 100%;

    margin-bottom: 22px;
}


/* ==========================================
   Playlist
========================================== */

.playlist-title {

    font-size: 12px;

    color: #94a3b8;

    font-weight: 700;

    letter-spacing: 0.08em;

    margin-bottom: 10px;
}


.playlist {

    list-style: none;

    max-height: 210px;

    overflow-y: auto;

    border-radius: 14px;

    background:
        rgba(0, 0, 0, 0.2);
}


.song {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px 15px;

    cursor: pointer;

    border-bottom:
        1px solid
        rgba(255, 255, 255, 0.05);

    transition:
        background 0.2s ease;
}


.song:hover {

    background:
        rgba(255, 255, 255, 0.08);
}


.song.active {

    background:
        rgba(99, 102, 241, 0.35);
}


.number {

    width: 22px;

    min-width: 22px;

    text-align: center;

    color: #94a3b8;

    font-size: 12px;
}


.song-name {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;
}


/* ==========================================
   모바일
========================================== */

@media (max-width: 500px) {

    .player {

        padding: 20px;
    }

    .album {

        height: 150px;

        font-size: 50px;
    }

}

</style>
</head>


<body>


<!-- ==========================================
     배경
========================================== -->

<div id="videoBackground">


    <!-- 1번 BrooklynBloodPop! GIF 배경 -->

    <div
        id="backgroundImage1"
        class="background-image">
    </div>


    <!-- 2번 i told u v1 영상 배경 -->

    <video
        id="backgroundVideo1"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20(2).mp4">
    </video>


    <!-- 3번 너 영상 배경 -->

    <video
        id="backgroundVideo2"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_Media_TiOpGgCXeT0_001_480p%20(1).mp4">
    </video>


    <!-- 4번 relations 이미지 배경 -->

    <div
        id="backgroundImage2"
        class="background-image">
    </div>


</div>


<div id="videoOverlay"></div>


<!-- ==========================================
     플레이어
========================================== -->

<div class="player">


    <div class="album">
        🎧
    </div>


    <div
        class="title"
        id="songTitle">

        곡을 선택해주세요

    </div>


    <div
        class="artist"
        id="songArtist">

        N0DE SOUNDS

    </div>


    <audio
        id="audio"
        controls
        preload="metadata">
    </audio>


    <div class="playlist-title">
        PLAYLIST
    </div>


    <ul
        class="playlist"
        id="playlist">
    </ul>


</div>


<script>

const audio =
    document.getElementById("audio");

const background =
    document.getElementById("videoBackground");

const backgroundVideo1 =
    document.getElementById("backgroundVideo1");

const backgroundVideo2 =
    document.getElementById("backgroundVideo2");

const backgroundImage1 =
    document.getElementById("backgroundImage1");

const backgroundImage2 =
    document.getElementById("backgroundImage2");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playlist =
    document.getElementById("playlist");


let currentIndex = 0;


/* ==========================================
   이미지 배경 미리 로드
========================================== */

backgroundImage1.style.backgroundImage =
    "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/85a074861f51fc3a560a6077e1162bbb.gif')";

backgroundImage2.style.backgroundImage =
    "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/40d89af3f71dddcdca7065a07fc6e069.jpg')";


/* ==========================================
   음악 데이터
========================================== */

const songs = [

    /* 1번 */

    {
        title:
            "BrooklynBloodPop!",

        artist:
            "Nightcore",

        file:
            "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        background:
            "image1"
    },


    /* 2번 */

    {
        title:
            "i told u v1",

        artist:
            "midwxst",

        file:
            "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        background:
            "video1"
    },


    /* 3번 */

    {
        title:
            "너",

        artist:
            "ycs",

        file:
            "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        background:
            "video2"
    },


    /* 4번 */

    {
        title:
            "relations",

        artist:
            "이상형",

        file:
            "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        background:
            "image2"
    }

];


/* ==========================================
   모든 배경 숨기기
========================================== */

function hideAllBackgrounds() {

    backgroundVideo1.pause();
    backgroundVideo2.pause();

    backgroundVideo1.classList.remove("active");
    backgroundVideo2.classList.remove("active");
    backgroundImage1.classList.remove("active");
    backgroundImage2.classList.remove("active");

    background.classList.remove("show");
}


/* ==========================================
   현재 배경 요소 가져오기
========================================== */

function getBackgroundElement() {

    const song = songs[currentIndex];

    if (song.background === "video1") return backgroundVideo1;
    if (song.background === "video2") return backgroundVideo2;
    if (song.background === "image1") return backgroundImage1;
    if (song.background === "image2") return backgroundImage2;

    return null;
}


/* ==========================================
   배경 시작
========================================== */

function startBackground() {

    const el = getBackgroundElement();

    if (!el) {
        hideAllBackgrounds();
        return;
    }

    const isVideo =
        el === backgroundVideo1 ||
        el === backgroundVideo2;


    if (el !== backgroundVideo1) {
        backgroundVideo1.pause();
        backgroundVideo1.classList.remove("active");
    }

    if (el !== backgroundVideo2) {
        backgroundVideo2.pause();
        backgroundVideo2.classList.remove("active");
    }

    if (el !== backgroundImage1) {
        backgroundImage1.classList.remove("active");
    }

    if (el !== backgroundImage2) {
        backgroundImage2.classList.remove("active");
    }

    background.classList.add("show");

    el.classList.add("active");

    if (isVideo) {

        if (el.readyState >= 1) {
            try {
                el.currentTime = audio.currentTime;
            } catch (e) {}
        }

        el.play().catch(e => {
            console.error("배경 영상 재생 실패:", e);
        });
    }
}


/* ==========================================
   Playlist
========================================== */

function renderPlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const item =
            document.createElement("li");

        item.className = "song";

        if (index === currentIndex) {
            item.classList.add("active");
        }

        item.innerHTML = `
            <span class="number">${index + 1}</span>
            <span class="song-name">${song.title}</span>
        `;

        item.addEventListener("click", () => {
            loadSong(index);
        });

        playlist.appendChild(item);
    });
}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {

    currentIndex = index;

    const song = songs[currentIndex];

    audio.pause();

    hideAllBackgrounds();

    audio.src = song.file;
    audio.load();

    songTitle.textContent  = song.title;
    songArtist.textContent = song.artist;

    renderPlaylist();

    audio.play()
        .then(() => {
            if (song.background !== null) {
                startBackground();
            }
        })
        .catch(e => {
            console.error("음악 재생 실패:", e);
        });
}


/* ==========================================
   음악 재생
========================================== */

audio.addEventListener("play", () => {

    const song = songs[currentIndex];

    if (song.background !== null) {
        startBackground();
    } else {
        hideAllBackgrounds();
    }
});


/* ==========================================
   음악 일시정지
========================================== */

audio.addEventListener("pause", () => {

    const el = getBackgroundElement();

    if (
        el === backgroundVideo1 ||
        el === backgroundVideo2
    ) {
        el.pause();
    }
});


/* ==========================================
   싱크
========================================== */

audio.addEventListener("timeupdate", () => {

    const el = getBackgroundElement();

    if (
        el !== backgroundVideo1 &&
        el !== backgroundVideo2
    ) {
        return;
    }

    if (el.readyState < 2) {
        return;
    }

    const diff = Math.abs(
        el.currentTime - audio.currentTime
    );

    if (diff > 0.35) {
        try {
            el.currentTime = audio.currentTime;
        } catch (e) {}
    }
});


/* ==========================================
   Seek
========================================== */

audio.addEventListener("seeking", () => {

    const el = getBackgroundElement();

    if (
        el !== backgroundVideo1 &&
        el !== backgroundVideo2
    ) {
        return;
    }

    try {
        el.currentTime = audio.currentTime;
    } catch (e) {}
});


/* ==========================================
   음악 종료
========================================== */

audio.addEventListener("ended", () => {

    const next = (currentIndex + 1) % songs.length;
    loadSong(next);
});


/* ==========================================
   영상 로딩 완료 이벤트
========================================== */

backgroundVideo1.addEventListener("loadeddata", () => {

    if (
        songs[currentIndex].background === "video1" &&
        !audio.paused
    ) {
        startBackground();
    }
});

backgroundVideo2.addEventListener("loadeddata", () => {

    if (
        songs[currentIndex].background === "video2" &&
        !audio.paused
    ) {
        startBackground();
    }
});


/* ==========================================
   영상 오류
========================================== */

backgroundVideo1.addEventListener("error", () => {
    console.error("배경 영상1 로딩 실패:", backgroundVideo1.error);
});

backgroundVideo2.addEventListener("error", () => {
    console.error("배경 영상2 로딩 실패:", backgroundVideo2.error);
});


/* ==========================================
   초기화
========================================== */

renderPlaylist();
loadSong(0);

</script>

</body>
</html>
