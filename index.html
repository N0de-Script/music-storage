<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N0DE SOUNDS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Arial,
        "Segoe UI",
        sans-serif;

    background: #10131a;
    color: white;

    min-height: 100vh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

#background {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    background: #10131a;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
}

#background.show {
    opacity: 1;
}

#backgroundVideo {
    position: absolute;
    top: -4%;
    left: -4%;
    width: 108%;
    height: 108%;
    object-fit: cover;
    display: block;
    filter: blur(10px) brightness(0.48);
    transform: scale(1.03);
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
}

#backgroundVideo.show {
    opacity: 1;
}

#backgroundImage {
    position: absolute;
    inset: -4%;
    width: 108%;
    height: 108%;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    filter: blur(10px) brightness(0.48);
    transform: scale(1.03);
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
}

#backgroundImage.show {
    opacity: 1;
}

#backgroundOverlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    background: rgba(0, 0, 0, 0.25);
    pointer-events: none;
}

.player {
    position: relative;
    z-index: 10;
    width: calc(100% - 30px);
    max-width: 430px;
    padding: 28px;
    border-radius: 24px;
    background: rgba(20, 25, 35, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
}

.album {
    width: 100%;
    height: 180px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    margin-bottom: 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.title {
    text-align: center;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
    word-break: break-word;
}

.artist {
    text-align: center;
    margin-top: 5px;
    margin-bottom: 18px;
    color: #aeb8c7;
    font-size: 14px;
}

audio {
    width: 100%;
    margin-bottom: 22px;
}

.playlist-title {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
}

.playlist {
    list-style: none;
    max-height: 210px;
    overflow-y: auto;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.2);
}

.song {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 15px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    transition: background 0.2s ease;
}

.song:hover {
    background: rgba(255, 255, 255, 0.08);
}

.song.active {
    background: rgba(99, 102, 241, 0.35);
}

.number {
    width: 22px;
    min-width: 22px;
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
}

.song-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
}

@media (max-width: 500px) {
    .player { padding: 20px; }
    .album { height: 150px; font-size: 50px; }
}

</style>
</head>

<body>

<div id="background">
    <video
        id="backgroundVideo"
        muted
        loop
        playsinline
        preload="auto">
    </video>
    <div id="backgroundImage"></div>
</div>

<div id="backgroundOverlay"></div>

<div class="player">
    <div class="album">🎧</div>
    <div class="title" id="songTitle">곡을 선택해주세요</div>
    <div class="artist" id="songArtist">N0DE SOUNDS</div>
    <audio id="audio" controls preload="metadata"></audio>
    <div class="playlist-title">PLAYLIST</div>
    <ul class="playlist" id="playlist"></ul>
</div>

<script>

const audio           = document.getElementById("audio");
const background      = document.getElementById("background");
const backgroundVideo = document.getElementById("backgroundVideo");
const backgroundImage = document.getElementById("backgroundImage");
const songTitle       = document.getElementById("songTitle");
const songArtist      = document.getElementById("songArtist");
const playlist        = document.getElementById("playlist");

let currentIndex = 0;


/* ==========================================
   배경 주소
========================================== */

const BACKGROUNDS = {

    brooklyn:
        "https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/85a074861f51fc3a560a6077e1162bbb.gif",

    video1:
        "https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20(2).mp4",

    video2:
        "https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_Media_TiOpGgCXeT0_001_480p%20(1).mp4",

    relations:
        "https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/40d89af3f71dddcdca7065a07fc6e069.jpg"

};


/* ==========================================
   음악 데이터
========================================== */

const songs = [

    {
        title:          "BrooklynBloodPop!",
        artist:         "Nightcore",
        file:           "./Nightcore%20-%20BrooklynBloodPop!.mp3",
        background:     "brooklyn",
        backgroundType: "image"
    },

    {
        title:          "i told u v1",
        artist:         "midwxst",
        file:           "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",
        background:     "video1",
        backgroundType: "video"
    },

    {
        title:          "너",
        artist:         "ycs",
        file:           "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",
        background:     "video2",
        backgroundType: "video"
    },

    {
        title:          "relations",
        artist:         "이상형",
        file:           "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",
        background:     "relations",
        backgroundType: "image"
    }

];


/* ==========================================
   배경 제거
========================================== */

function clearBackground() {

    background.classList.remove("show");
    backgroundVideo.classList.remove("show");
    backgroundImage.classList.remove("show");

    backgroundVideo.pause();
    backgroundVideo.removeAttribute("src");
    backgroundVideo.load();

    backgroundImage.style.backgroundImage = "";
}


/* ==========================================
   배경 표시
========================================== */

function setBackground(song) {

    if (!song.background) {
        return;
    }

    const url = BACKGROUNDS[song.background];

    if (!url) {
        console.error("배경 주소 없음:", song.background);
        return;
    }


    /* ======================================
       이미지 / GIF
    ====================================== */

    if (song.backgroundType === "image") {

        const img = new Image();

        img.onload = function () {

            backgroundImage.style.backgroundImage = `url("${url}")`;
            background.classList.add("show");

            requestAnimationFrame(() => {
                backgroundImage.classList.add("show");
            });
        };

        img.onerror = function () {
            console.error("이미지 배경 로딩 실패:", url);
        };

        img.src = url;

        return;
    }


    /* ======================================
       MP4
    ====================================== */

    function onCanPlay() {

        backgroundVideo.removeEventListener("canplay", onCanPlay);

        try {
            backgroundVideo.currentTime = audio.currentTime;
        } catch (e) {}

        background.classList.add("show");

        requestAnimationFrame(() => {
            backgroundVideo.classList.add("show");
        });

        backgroundVideo.play().catch(e => {
            console.error("배경 영상 재생 실패:", e);
        });
    }

    backgroundVideo.addEventListener("canplay", onCanPlay);

    backgroundVideo.src = url;
    backgroundVideo.load();
}


/* ==========================================
   Playlist
========================================== */

function renderPlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const item = document.createElement("li");
        item.className = "song";

        if (index === currentIndex) {
            item.classList.add("active");
        }

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = index + 1;

        const name = document.createElement("span");
        name.className = "song-name";
        name.textContent = song.title;

        item.appendChild(number);
        item.appendChild(name);

        item.addEventListener("click", () => {
            loadSong(index);
        });

        playlist.appendChild(item);
    });
}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {

    currentIndex = index;

    const song = songs[currentIndex];

    audio.pause();

    clearBackground();

    audio.src = song.file;
    audio.load();

    songTitle.textContent  = song.title;
    songArtist.textContent = song.artist;

    renderPlaylist();

    requestAnimationFrame(() => {
        setBackground(song);
    });

    audio.play().catch(e => {
        console.error("음악 재생 실패:", e);
    });
}


/* ==========================================
   음악 재생
========================================== */

audio.addEventListener("play", () => {

    const song = songs[currentIndex];

    if (song.backgroundType !== "video") {
        return;
    }

    if (backgroundVideo.readyState >= 2) {

        try {
            backgroundVideo.currentTime = audio.currentTime;
        } catch (e) {}

        backgroundVideo.play().catch(() => {});
    }
});


/* ==========================================
   음악 일시정지
========================================== */

audio.addEventListener("pause", () => {
    backgroundVideo.pause();
});


/* ==========================================
   싱크
========================================== */

audio.addEventListener("timeupdate", () => {

    const song = songs[currentIndex];

    if (song.backgroundType !== "video") {
        return;
    }

    if (backgroundVideo.readyState < 2) {
        return;
    }

    const diff = Math.abs(
        backgroundVideo.currentTime - audio.currentTime
    );

    if (diff > 0.35) {
        try {
            backgroundVideo.currentTime = audio.currentTime;
        } catch (e) {}
    }
});


/* ==========================================
   Seek
========================================== */

audio.addEventListener("seeking", () => {

    const song = songs[currentIndex];

    if (song.backgroundType !== "video") {
        return;
    }

    if (backgroundVideo.readyState < 1) {
        return;
    }

    try {
        backgroundVideo.currentTime = audio.currentTime;
    } catch (e) {}
});


/* ==========================================
   음악 종료
========================================== */

audio.addEventListener("ended", () => {

    const next = (currentIndex + 1) % songs.length;
    loadSong(next);
});


/* ==========================================
   초기화
========================================== */

renderPlaylist();
loadSong(0);

</script>

</body>
</html>
