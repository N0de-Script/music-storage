<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N0DE SOUNDS</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #08090c;
    color: #f8fafc;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* ==========================================
   배경
========================================== */

#videoBackground {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    background: #08090c;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
}

#videoBackground.show {
    opacity: 1;
    visibility: visible;
}


/* ==========================================
   배경 영상 & 이미지
========================================== */

.background-video,
.background-image {
    position: absolute;
    top: -5%;
    left: -5%;
    width: 110%;
    height: 110%;
    object-fit: cover;
    display: block;
    filter: blur(24px) brightness(0.38) saturate(1.2);
    transform: scale(1.05);
    opacity: 0;
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
}

.background-image {
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

.background-video.active,
.background-image.active {
    opacity: 1;
}


/* ==========================================
   배경 오버레이 (Dark Modern Vignette)
========================================== */

#videoOverlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(13, 15, 23, 0.25) 0%, rgba(8, 9, 12, 0.8) 100%);
}


/* ==========================================
   Dark Modern Glass Player Container
========================================== */

.player {
    position: relative;
    z-index: 10;
    width: calc(100% - 32px);
    max-width: 410px;
    padding: 30px;
    border-radius: 28px;
    background: rgba(18, 22, 32, 0.65);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.75),
        0 18px 36px -18px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}


/* ==========================================
   앨범 커버 / 프레임
========================================== */

.album {
    width: 100%;
    height: 190px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    margin-bottom: 22px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
    position: relative;
    overflow: hidden;
}

.album::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 120%, rgba(99, 102, 241, 0.18), transparent 70%);
    pointer-events: none;
}


/* ==========================================
   제목 및 아티스트
========================================== */

.title {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.02em;
    color: #ffffff;
    word-break: break-word;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
}

.artist {
    text-align: center;
    margin-top: 6px;
    margin-bottom: 22px;
    color: #94a3b8;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: -0.01em;
}


/* ==========================================
   오디오 컨트롤 (Dark Theme Custom Style)
========================================== */

audio {
    width: 100%;
    margin-bottom: 22px;
    outline: none;
    border-radius: 30px;
    filter: invert(0.92) hue-rotate(180deg) saturate(1.4);
    opacity: 0.9;
    transition: opacity 0.2s ease;
}

audio:hover {
    opacity: 1;
}


/* ==========================================
   Playlist (Dark Modern Design)
========================================== */

.playlist-title {
    font-size: 11px;
    color: #64748b;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.playlist-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
}

.playlist {
    list-style: none;
    max-height: 200px;
    overflow-y: auto;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 6px;
}

/* Custom Scrollbar */
.playlist::-webkit-scrollbar {
    width: 4px;
}

.playlist::-webkit-scrollbar-track {
    background: transparent;
}

.playlist::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 10px;
}

.playlist::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.3);
}

.song {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    cursor: pointer;
    border-radius: 10px;
    margin-bottom: 2px;
    border: 1px solid transparent;
    transition: all 0.2s ease;
}

.song:hover {
    background: rgba(255, 255, 255, 0.06);
    transform: translateX(2px);
}

.song.active {
    background: rgba(99, 102, 241, 0.18);
    border-color: rgba(99, 102, 241, 0.35);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.12);
}

.song.active .number {
    color: #818cf8;
    font-weight: 700;
}

.song.active .song-name {
    color: #ffffff;
    font-weight: 600;
}

.number {
    width: 20px;
    min-width: 20px;
    text-align: center;
    color: #64748b;
    font-size: 12px;
    font-weight: 500;
}

.song-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13.5px;
    color: #cbd5e1;
    transition: color 0.2s ease;
}


/* ==========================================
   모바일 반응형
========================================== */

@media (max-width: 500px) {
    .player {
        padding: 22px;
        border-radius: 24px;
    }

    .album {
        height: 150px;
        font-size: 46px;
        margin-bottom: 18px;
    }

    .title {
        font-size: 18px;
    }

    .artist {
        font-size: 13px;
        margin-bottom: 18px;
    }
}

</style>
</head>


<body>


<div id="videoBackground">

    <div
        id="backgroundImage1"
        class="background-image">
    </div>

    <video
        id="backgroundVideo1"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20(2).mp4">
    </video>

    <video
        id="backgroundVideo2"
        class="background-video"
        muted
        loop
        playsinline
        preload="auto"
        src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_Media_TiOpGgCXeT0_001_480p%20(1).mp4">
    </video>

    <div
        id="backgroundImage2"
        class="background-image">
    </div>

</div>


<div id="videoOverlay"></div>


<div class="player">

    <div class="album">
        🎧
    </div>

    <div
        class="title"
        id="songTitle">
        곡을 선택해주세요
    </div>

    <div
        class="artist"
        id="songArtist">
        N0DE SOUNDS
    </div>

    <audio
        id="audio"
        controls
        preload="metadata">
    </audio>

    <div class="playlist-title">
        PLAYLIST
    </div>

    <ul
        class="playlist"
        id="playlist">
    </ul>

</div>


<script>

const audio =
    document.getElementById("audio");

const background =
    document.getElementById("videoBackground");

const backgroundVideo1 =
    document.getElementById("backgroundVideo1");

const backgroundVideo2 =
    document.getElementById("backgroundVideo2");

const backgroundImage1 =
    document.getElementById("backgroundImage1");

const backgroundImage2 =
    document.getElementById("backgroundImage2");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playlist =
    document.getElementById("playlist");


let currentIndex = 0;


/* ==========================================
   이미지 배경 미리 로드
========================================== */

backgroundImage1.style.backgroundImage =
    "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/85a074861f51fc3a560a6077e1162bbb.gif')";

backgroundImage2.style.backgroundImage =
    "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/40d89af3f71dddcdca7065a07fc6e069.jpg')";


/* ==========================================
   음악 데이터
========================================== */

const songs = [

    /* 1번 */
    {
        title:
            "BrooklynBloodPop!",

        artist:
            "Nightcore",

        file:
            "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        background:
            "image1"
    },


    /* 2번 */
    {
        title:
            "i told u v1",

        artist:
            "midwxst",

        file:
            "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        background:
            "video1"
    },


    /* 3번 */
    {
        title:
            "너",

        artist:
            "ycs",

        file:
            "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        background:
            "video2"
    },


    /* 4번 */
    {
        title:
            "relations",

        artist:
            "이상형",

        file:
            "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        background:
            "image2"
    }

];


/* ==========================================
   모든 배경 숨기기
========================================== */

function hideAllBackgrounds() {

    backgroundVideo1.pause();
    backgroundVideo2.pause();

    backgroundVideo1.classList.remove("active");
    backgroundVideo2.classList.remove("active");
    backgroundImage1.classList.remove("active");
    backgroundImage2.classList.remove("active");

    background.classList.remove("show");
}


/* ==========================================
   현재 배경 요소 가져오기
========================================== */

function getBackgroundElement() {

    const song = songs[currentIndex];

    if (song.background === "video1") return backgroundVideo1;
    if (song.background === "video2") return backgroundVideo2;
    if (song.background === "image1") return backgroundImage1;
    if (song.background === "image2") return backgroundImage2;

    return null;
}


/* ==========================================
   배경 시작
========================================== */

function startBackground() {

    const el = getBackgroundElement();

    if (!el) {
        hideAllBackgrounds();
        return;
    }

    const isVideo =
        el === backgroundVideo1 ||
        el === backgroundVideo2;


    if (el !== backgroundVideo1) {
        backgroundVideo1.pause();
        backgroundVideo1.classList.remove("active");
    }

    if (el !== backgroundVideo2) {
        backgroundVideo2.pause();
        backgroundVideo2.classList.remove("active");
    }

    if (el !== backgroundImage1) {
        backgroundImage1.classList.remove("active");
    }

    if (el !== backgroundImage2) {
        backgroundImage2.classList.remove("active");
    }

    background.classList.add("show");

    el.classList.add("active");

    if (isVideo) {

        if (el.readyState >= 1) {
            try {
                el.currentTime = audio.currentTime;
            } catch (e) {}
        }

        el.play().catch(e => {
            console.error("배경 영상 재생 실패:", e);
        });
    }
}


/* ==========================================
   Playlist
========================================== */

function renderPlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const item =
            document.createElement("li");

        item.className = "song";

        if (index === currentIndex) {
            item.classList.add("active");
        }

        item.innerHTML = `
            <span class="number">${index + 1}</span>
            <span class="song-name">${song.title}</span>
        `;

        item.addEventListener("click", () => {
            loadSong(index);
        });

        playlist.appendChild(item);
    });
}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {

    currentIndex = index;

    const song = songs[currentIndex];

    audio.pause();

    hideAllBackgrounds();

    audio.src = song.file;
    audio.load();

    songTitle.textContent  = song.title;
    songArtist.textContent = song.artist;

    renderPlaylist();

    audio.play()
        .then(() => {
            if (song.background !== null) {
                startBackground();
            }
        })
        .catch(e => {
            console.error("음악 재생 실패:", e);
        });
}


/* ==========================================
   음악 재생
========================================== */

audio.addEventListener("play", () => {

    const song = songs[currentIndex];

    if (song.background !== null) {
        startBackground();
    } else {
        hideAllBackgrounds();
    }
});


/* ==========================================
   음악 일시정지
========================================== */

audio.addEventListener("pause", () => {

    const el = getBackgroundElement();

    if (
        el === backgroundVideo1 ||
        el === backgroundVideo2
    ) {
        el.pause();
    }
});


/* ==========================================
   싱크
========================================== */

audio.addEventListener("timeupdate", () => {

    const el = getBackgroundElement();

    if (
        el !== backgroundVideo1 &&
        el !== backgroundVideo2
    ) {
        return;
    }

    if (el.readyState < 2) {
        return;
    }

    const diff = Math.abs(
        el.currentTime - audio.currentTime
    );

    if (diff > 0.35) {
        try {
            el.currentTime = audio.currentTime;
        } catch (e) {}
    }
});


/* ==========================================
   Seek
========================================== */

audio.addEventListener("seeking", () => {

    const el = getBackgroundElement();

    if (
        el !== backgroundVideo1 &&
        el !== backgroundVideo2
    ) {
        return;
    }

    try {
        el.currentTime = audio.currentTime;
    } catch (e) {}
});


/* ==========================================
   음악 종료
========================================== */

audio.addEventListener("ended", () => {

    const next = (currentIndex + 1) % songs.length;
    loadSong(next);
});


/* ==========================================
   영상 로딩 완료 이벤트
========================================== */

backgroundVideo1.addEventListener("loadeddata", () => {

    if (
        songs[currentIndex].background === "video1" &&
        !audio.paused
    ) {
        startBackground();
    }
});

backgroundVideo2.addEventListener("loadeddata", () => {

    if (
        songs[currentIndex].background === "video2" &&
        !audio.paused
    ) {
        startBackground();
    }
});


/* ==========================================
   영상 오류
========================================== */

backgroundVideo1.addEventListener("error", () => {
    console.error("배경 영상1 로딩 실패:", backgroundVideo1.error);
});

backgroundVideo2.addEventListener("error", () => {
    console.error("배경 영상2 로딩 실패:", backgroundVideo2.error);
});


/* ==========================================
   초기화
========================================== */

renderPlaylist();
loadSong(0);

</script>

</body>
</html>
