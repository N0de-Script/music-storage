<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N1gh7m4r3 Playlist</title>

<!-- Pretendard Web Font -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-weight: 300;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    background: #000000;
    color: #ffffff;
    min-height: 100vh;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
}


/* ==========================================
   배경 (Video / Image)
========================================== */

#videoBackground {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    background: #000000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    pointer-events: none;
}

#videoBackground.show {
    opacity: 1;
    visibility: visible;
}

.background-video,
.background-image {
    position: absolute;
    top: -5%;
    left: -5%;
    width: 110%;
    height: 110%;
    object-fit: cover;
    display: block;
    filter: blur(5px) brightness(0.55) saturate(1.1);
    transform: scale(1.03);
    opacity: 0;
    transition: opacity 0.8s ease, filter 0.3s ease;
    pointer-events: none;
}

.background-image {
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

.background-video.active,
.background-image.active {
    opacity: 1;
}

#videoOverlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.65) 90%);
    transition: background 0.3s ease;
}


/* ==========================================
   Player Card
========================================== */

.player {
    position: relative;
    z-index: 10;
    width: calc(100% - 32px);
    max-width: 380px;
    padding: 28px 24px 20px 24px;
    border-radius: 20px;
    background: rgb(12, 12, 12);
    border: 1px solid rgb(24, 24, 24);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.brand-tag {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: #ffffff;
    opacity: 0.6;
    margin-bottom: 20px;
}


/* ==========================================
   Track Info
========================================== */

.track-info {
    text-align: center;
    width: 100%;
    margin-bottom: 20px;
}

.title {
    font-size: 20px;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: #ffffff;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist {
    font-size: 13px;
    color: #ffffff;
    font-weight: 300;
    opacity: 0.5;
}


/* ==========================================
   Progress Bar
========================================== */

.progress-section {
    width: 100%;
    margin-bottom: 20px;
}

.progress-bar-container {
    width: 100%;
    height: 4px;
    background: rgb(28, 28, 28);
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #ffffff;
    border-radius: 8px;
    transition: width 0.1s linear;
}

.time-display {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #ffffff;
    opacity: 0.5;
    margin-top: 6px;
    font-weight: 300;
}


/* ==========================================
   Controls
========================================== */

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    margin-bottom: 24px;
    width: 100%;
}

.ctrl-btn {
    background: transparent !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    opacity: 0.85;
    transition: opacity 0.2s ease, transform 0.15s ease;
}

.ctrl-btn:hover {
    opacity: 1;
    transform: scale(1.12);
}

.ctrl-btn:active {
    transform: scale(0.92);
}

.ctrl-btn svg {
    fill: #ffffff;
    display: block;
}


/* ==========================================
   Playlist Container & Animation
========================================== */

.playlist-container {
    width: 100%;
}

.playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    padding: 4px 2px;
}

.playlist-title {
    font-size: 11px;
    color: #ffffff;
    font-weight: 400;
    letter-spacing: 0.15em;
    opacity: 0.6;
}

.toggle-btn {
    background: none;
    border: none;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.6;
    transition: opacity 0.2s ease;
}

.toggle-btn:hover {
    opacity: 1;
}

.toggle-icon {
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.playlist-wrapper {
    max-height: 250px;
    opacity: 1;
    overflow: hidden;
    margin-top: 10px;
    transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin-top 0.35s ease;
}

.playlist-container.collapsed .playlist-wrapper {
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    pointer-events: none;
}

.playlist-container.collapsed .toggle-icon {
    transform: rotate(180deg);
}

.search-input {
    width: 100%;
    padding: 8px 12px;
    margin-bottom: 8px;
    background: rgb(16, 16, 16);
    border: 1px solid rgb(25, 25, 25);
    border-radius: 8px;
    color: #ffffff;
    font-size: 12px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s ease;
}

.search-input::placeholder {
    color: #666666;
}

.search-input:focus {
    border-color: rgb(50, 50, 50);
}

.playlist {
    list-style: none;
    max-height: 180px;
    overflow-y: auto;
    border-radius: 10px;
    background: rgb(8, 8, 8);
    border: 1px solid rgb(20, 20, 20);
    padding: 4px;
}

.playlist::-webkit-scrollbar {
    width: 4px;
}
.playlist::-webkit-scrollbar-thumb {
    background: rgb(30, 30, 30);
    border-radius: 8px;
}

.song {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    cursor: pointer;
    border-radius: 8px;
    margin-bottom: 2px;
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.2s ease;
}

.song:hover {
    background: rgb(20, 20, 20);
}

.song.active {
    background: rgb(22, 22, 22);
    border: 1px solid rgb(40, 40, 40);
}

.number {
    width: 16px;
    text-align: center;
    color: #ffffff;
    opacity: 0.4;
    font-size: 11px;
    font-weight: 300;
}

.song-name {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
    color: #ffffff;
    font-weight: 300;
}

.artist-sub {
    font-size: 11px;
    color: #777777;
    margin-left: 4px;
    font-weight: 300;
}

/* 재생 중 표시 배지 */
.playing-badge {
    margin-left: auto;
    font-size: 10px;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 2px 7px;
    border-radius: 10px;
    white-space: nowrap;
    font-weight: 400;
}

/* 추가 예정 곡 비활성화 스타일 */
.song.upcoming-item {
    cursor: not-allowed;
    opacity: 0.45;
}

.song.upcoming-item:hover {
    background: transparent !important;
}

.upcoming-badge {
    margin-left: auto;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
}


/* ==========================================
   Beta Version Footer
========================================== */

.beta-tag {
    font-size: 10px;
    color: #ffffff;
    opacity: 0.3;
    letter-spacing: 0.12em;
    margin-top: 20px;
    text-align: center;
}


/* ==========================================
   Toast Notification
========================================== */

.toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
}

.toast {
    background: rgb(16, 16, 16);
    border: 1px solid rgb(40, 40, 40);
    color: #ffffff;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 300;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    gap: 10px;

    opacity: 0;
    transform: translateX(calc(100% + 80px));
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: auto;
    min-width: 240px;
    max-width: 320px;
    will-change: transform, opacity;
}

.toast.show {
    opacity: 1;
    transform: translateX(0);
}

.toast-icon {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    opacity: 0.8;
    flex-shrink: 0;
}


/* ==========================================
   Mobile Responsive
========================================== */

@media (max-width: 480px) {
    .background-video,
    .background-image {
        filter: blur(3px) brightness(0.72) saturate(1.15);
    }

    #videoOverlay {

    .song {

        padding: 11px 14px;

        background: rgba(16, 16, 16, 0.95);
        backdrop-filter: blur(8px);
    }
}

</style>

<script>

// DOM element references instantiated for application state manipulation.
const audio = document.getElementById("audio");
const background = document.getElementById("videoBackground");
const backgroundVideo1 = document.getElementById("backgroundVideo1");
const backgroundVideo2 = document.getElementById("backgroundVideo2");
const backgroundImage1 = document.getElementById("backgroundImage1");
const backgroundImage2 = document.getElementById("backgroundImage2");

const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");
const playlist = document.getElementById("playlist");

const playPauseBtn = document.getElementById("playPauseBtn");
const playIcon = document.getElementById("playIcon");
const pauseIcon = document.getElementById("pauseIcon");
const rewindBtn = document.getElementById("rewindBtn");
const forwardBtn = document.getElementById("forwardBtn");

const progressBarContainer = document.getElementById("progressBarContainer");
const progressFill = document.getElementById("progressFill");
const currentTimeEl = document.getElementById("currentTime");
const durationTimeEl = document.getElementById("durationTime");

const playlistContainer = document.getElementById("playlistContainer");
const playlistHeader = document.getElementById("playlistHeader");
const searchInput = document.getElementById("searchInput");
const toastContainer = document.getElementById("toastContainer");

// Sentinel variable governing active track index selection (-1 signifies quiescent baseline state).
let currentIndex = -1;


backgroundImage1.style.backgroundImage = "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/85a074861f51fc3a560a6077e1162bbb.gif')";
backgroundImage2.style.backgroundImage = "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/40d89af3f71dddcdca7065a07fc6e069.jpg')";


// Data repository encapsulating playable compositions and prospective upcoming items.
const songs = [
    { title: "BrooklynBloodPop!", artist: "Syko", file: "./Nightcore%20-%20BrooklynBloodPop!.mp3", background: "image1", upcoming: false },
    { title: "i told u v1", artist: "midwxst", file: "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3", background: "video1", upcoming: false },
    { title: "너", artist: "ycs", file: "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3", background: "video2", upcoming: false },
    { title: "relations", artist: "이상형", file: "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3", background: "image2", upcoming: false },
    
    /* Pending integration composition (non-interactive placeholder item) */
    { title: "신곡 업데이트 예정", artist: "Artist", upcoming: true }
];


/* ==========================================
   Asynchronous Toast Notification Pipeline
========================================== */

// Instantiates temporary DOM notifications to communicate operational status dynamically.
function showToast(message) {
    if (!toastContainer) return;

    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerHTML = `<span class="toast-icon"></span><span>${message}</span>`;

    toastContainer.appendChild(toast);

    void toast.offsetWidth; // Forces synchronous layout recalculation to trigger CSS transitions reliably.
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => {
            toast.remove();
        }, 600);
    }, 2600);
}


/* ==========================================
   Visual Background Attenuation & Rendering
========================================== */

// Deactivates and suppresses all active dynamic background multimedia assets.
function hideAllBackgrounds() {
    backgroundVideo1.pause();
    backgroundVideo2.pause();
    backgroundVideo1.classList.remove("active");
    backgroundVideo2.classList.remove("active");
    backgroundImage1.classList.remove("active");
    backgroundImage2.classList.remove("active");
    background.classList.remove("show");
}

// Determines appropriate DOM node reference associated with current track background metadata.
function getBackgroundElement() {
    if (currentIndex < 0 || currentIndex >= songs.length) return null;
    const song = songs[currentIndex];
    if (song.upcoming) return null;
    if (song.background === "video1") return backgroundVideo1;
    if (song.background === "video2") return backgroundVideo2;
    if (song.background === "image1") return backgroundImage1;
    if (song.background === "image2") return backgroundImage2;
    return null;
}

// Orchestrates synchronicity between acoustic playback and visual backdrop presentation.
function startBackground() {
    const el = getBackgroundElement();
    if (!el) {
        hideAllBackgrounds();
        return;
    }

    const isVideo = (el === backgroundVideo1 || el === backgroundVideo2);

    if (el !== backgroundVideo1) { backgroundVideo1.pause(); backgroundVideo1.classList.remove("active"); }
    if (el !== backgroundVideo2) { backgroundVideo2.pause(); backgroundVideo2.classList.remove("active"); }
    if (el !== backgroundImage1) backgroundImage1.classList.remove("active");
    if (el !== backgroundImage2) backgroundImage2.classList.remove("active");

    background.classList.add("show");
    el.classList.add("active");

    if (isVideo) {
        if (el.readyState >= 1) {
            try { el.currentTime = audio.currentTime; } catch (e) {}
        }
        el.play().catch(e => console.error(e));
    }
}


// Converts floating-point temporal duration into standardized sexagesimal string representation.
function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}


/* Playlist DOM Construction & State Synchronization Protocol */
function renderPlaylist(filter = "") {
    playlist.innerHTML = "";
    const cleanFilter = filter.toLowerCase().trim();

    songs.forEach((song, index) => {
        const matchTitle = song.title.toLowerCase().includes(cleanFilter);
        const matchArtist = song.artist.toLowerCase().includes(cleanFilter);

        if (matchTitle || matchArtist) {
            const item = document.createElement("li");

            if (song.upcoming) {
                // Non-selectable placeholder item configuration
                item.className = "song upcoming-item";
                item.innerHTML = `
                    <span class="number">${index + 1}</span>
                    <span class="song-name">${song.title}</span>
                    <span class="upcoming-badge">추가 예정</span>
                `;
            } else {
                // Playable track item DOM setup and state binding
                item.className = "song";
                const isPlaying = (currentIndex !== -1 && index === currentIndex);
                
                if (isPlaying) {
                    item.classList.add("active");
                }

                item.innerHTML = `
                    <span class="number">${index + 1}</span>
                    <span class="song-name">${song.title} <span class="artist-sub">- ${song.artist}</span></span>
                    ${isPlaying ? '<span class="playing-badge">재생 중</span>' : ''}
                `;

                item.addEventListener("click", () => {
                    // Re-selection event logic: Halts acoustic playback, nullifies selection state, and cleans UI indicators
                    if (currentIndex === index) {
                        audio.pause();
                        audio.currentTime = 0;
                        currentIndex = -1; // Nullifies index to revert selection highlights & active badges

                        hideAllBackgrounds();

                        // Reverts metadata display artifacts to baseline state
                        songTitle.textContent = "곡을 선택해주세요";
                        songArtist.textContent = "???";
                        progressFill.style.width = "0%";
                        currentTimeEl.textContent = "0:00";
                        durationTimeEl.textContent = "0:00";

                        renderPlaylist(searchInput.value);
                        showToast("노래 재생 중지");
                    } else {
                        // Executes track loading pipeline for newly selected index
                        loadSong(index);
                    }
                });
            }

            playlist.appendChild(item);
        }
    });
}


searchInput.addEventListener("input", (e) => {
    renderPlaylist(e.target.value);
});


// Toggles playlist UI container expansion state
playlistHeader.addEventListener("click", () => {
    playlistContainer.classList.toggle("collapsed");
});


/* ==========================================
   Track Acquisition and Media Loading Pipeline
========================================== */

function loadSong(index) {
    if (songs[index].upcoming) return; // Restricts invocation on non-playable items

    currentIndex = index;
    const song = songs[currentIndex];

    audio.pause();
    hideAllBackgrounds();

    audio.src = song.file;
    audio.load();

    songTitle.textContent = song.title;
    songArtist.textContent = song.artist;

    renderPlaylist(searchInput.value);

    showToast(`'${song.title}' 곡이 선택되었습니다`);

    audio.play()
        .then(() => {
            if (song.background !== null) startBackground();
        })
        .catch(e => console.error("Autoplay restricted or file not found:", e));
}


/* ==========================================
   Playback Control Event Binders
========================================== */

playPauseBtn.addEventListener("click", () => {
    if (currentIndex === -1) {
        loadSong(0);
        return;
    }

    if (audio.paused) {
        audio.play().catch(e => console.error(e));
        showToast("노래 재생 성공");
    } else {
        audio.pause();
        showToast("노래 일시정지");
    }
});

rewindBtn.addEventListener("click", () => {
    if (currentIndex === -1) return;
    if (audio.duration) {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
    }
    showToast("노래를 10초 뒤로 되돌렸습니다!");
});

forwardBtn.addEventListener("click", () => {
    if (currentIndex === -1) return;
    if (audio.duration) {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
    }
    showToast("노래를 10초 앞으로 건너뛰었습니다!");
});


progressBarContainer.addEventListener("click", (e) => {
    if (currentIndex === -1) return;
    const width = progressBarContainer.clientWidth;
    const clickX = e.offsetX;
    const duration = audio.duration;

    if (duration) {
        audio.currentTime = (clickX / width) * duration;
    }
});


/* ==========================================
   HTMLAudioElement Event Handlers
========================================== */

audio.addEventListener("play", () => {
    playIcon.style.display = "none";
    pauseIcon.style.display = "block";

    if (currentIndex !== -1) {
        const song = songs[currentIndex];
        if (!song.upcoming && song.background !== null) {
            startBackground();
        } else {
            hideAllBackgrounds();
        }
    }
});

audio.addEventListener("pause", () => {
    playIcon.style.display = "block";
    pauseIcon.style.display = "none";

    hideAllBackgrounds();
});

audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${progressPercent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
    }

    const el = getBackgroundElement();
    if (el !== backgroundVideo1 && el !== backgroundVideo2) return;
    if (el.readyState < 2) return;

    const diff = Math.abs(el.currentTime - audio.currentTime);
    if (diff > 0.35) {
        try { el.currentTime = audio.currentTime; } catch (e) {}
    }
});

audio.addEventListener("seeking", () => {
    const el = getBackgroundElement();
    if (el !== backgroundVideo1 && el !== backgroundVideo2) return;
    try { el.currentTime = audio.currentTime; } catch (e) {}
});

audio.addEventListener("ended", () => {
    if (currentIndex === -1) return;
    
    // Cyclical iteration protocol across valid playable items
    const playableSongs = songs.filter(s => !s.upcoming);
    const nextPlayableIndex = (currentIndex + 1) % playableSongs.length;
    
    loadSong(nextPlayableIndex);
});


backgroundVideo1.addEventListener("loadeddata", () => {
    if (currentIndex !== -1 && songs[currentIndex].background === "video1" && !audio.paused) startBackground();
});

backgroundVideo2.addEventListener("loadeddata", () => {
    if (currentIndex !== -1 && songs[currentIndex].background === "video2" && !audio.paused) startBackground();
});


// Initialization execution
renderPlaylist();
showToast("원하는 노래를 틀어보세요!");

</script>

</body>
</html>
