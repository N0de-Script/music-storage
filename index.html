<script>


/* ==========================================
   요소
========================================== */

const audio =
    document.getElementById("audio");

const background =
    document.getElementById("background");

const bgNumber =
    document.getElementById("bgNumber");

const bgVideo1 =
    document.getElementById("bgVideo1");

const bgVideo2 =
    document.getElementById("bgVideo2");

const bgRelations =
    document.getElementById("bgRelations");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playlist =
    document.getElementById("playlist");


let currentIndex = 0;


/* ==========================================
   음악
========================================== */

const songs = [

    {
        title:
            "NUMBER TWERKNATION28",

        artist:
            "sped up / nightcore",

        file:
            "./NUMBER%20TWERKNATION28%20(sped%20upnightcore).mp3",

        background:
            "number"
    },


    {
        title:
            "BrooklynBloodPop!",

        artist:
            "Nightcore",

        file:
            "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        background:
            null
    },


    {
        title:
            "i told u v1",

        artist:
            "midwxst",

        file:
            "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        background:
            "video1"
    },


    {
        title:
            "너",

        artist:
            "ycs",

        file:
            "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        background:
            "video2"
    },


    {
        title:
            "relations",

        artist:
            "이상형",

        file:
            "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        background:
            "relations"
    }

];


/* ==========================================
   배경 목록
========================================== */

const backgrounds = {

    number:
        bgNumber,

    video1:
        bgVideo1,

    video2:
        bgVideo2,

    relations:
        bgRelations

};


/* ==========================================
   모든 배경 숨기기
========================================== */

function hideBackgrounds() {

    Object.values(backgrounds)
        .forEach(
            media => {

                media.classList.remove(
                    "visible"
                );


                if (
                    media.tagName === "VIDEO"
                ) {

                    media.pause();

                }

            }
        );


    background.classList.remove(
        "visible"
    );

}


/* ==========================================
   배경 표시
========================================== */

function showBackground(type) {

    hideBackgrounds();


    if (!type) {

        return;

    }


    const media =
        backgrounds[type];


    if (!media) {

        return;

    }


    /*
     * 배경 컨테이너 표시
     */

    background.classList.add(
        "visible"
    );


    /*
     * 배경 미디어 표시
     */

    media.classList.add(
        "visible"
    );


    /*
     * JPG
     */

    if (
        media.tagName === "IMG"
    ) {

        return;

    }


    /*
     * MP4 위치를 음악 위치에 맞춤
     */

    try {

        media.currentTime =
            audio.currentTime;

    } catch (error) {}


    /*
     * MP4 재생
     */

    media.play()
        .catch(
            error => {

                console.error(
                    "배경 영상 재생 실패:",
                    error
                );

            }
        );

}


/* ==========================================
   현재 배경 표시
========================================== */

function showCurrentBackground() {

    const song =
        songs[currentIndex];


    showBackground(
        song.background
    );

}


/* ==========================================
   Playlist
========================================== */

function renderPlaylist() {

    playlist.innerHTML = "";


    songs.forEach(
        (song, index) => {

            const item =
                document.createElement("li");


            item.className =
                "song";


            if (
                index === currentIndex
            ) {

                item.classList.add(
                    "active"
                );

            }


            const number =
                document.createElement("span");


            number.className =
                "number";


            number.textContent =
                index + 1;


            const name =
                document.createElement("span");


            name.className =
                "song-name";


            name.textContent =
                song.title;


            item.appendChild(
                number
            );


            item.appendChild(
                name
            );


            item.addEventListener(
                "click",
                () => {

                    loadSong(index);

                }
            );


            playlist.appendChild(
                item
            );

        }
    );

}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {

    currentIndex =
        index;


    const song =
        songs[index];


    /*
     * 기존 배경 제거
     */

    hideBackgrounds();


    /*
     * 음악 정지
     */

    audio.pause();


    /*
     * 음악 변경
     */

    audio.src =
        song.file;


    audio.load();


    /*
     * 정보 변경
     */

    songTitle.textContent =
        song.title;


    songArtist.textContent =
        song.artist;


    /*
     * Playlist 갱신
     */

    renderPlaylist();


    /*
     * 배경을 음악과 독립적으로 표시
     */

    if (
        song.background
    ) {

        showBackground(
            song.background
        );

    }


    /*
     * 음악 재생
     */

    audio.play()
        .catch(
            error => {

                console.error(
                    "음악 자동 재생 실패:",
                    error
                );

            }
        );

}


/* ==========================================
   음악 재생
========================================== */

audio.addEventListener(
    "play",
    () => {

        const song =
            songs[currentIndex];


        if (
            song.background
        ) {

            const media =
                backgrounds[
                    song.background
                ];


            /*
             * 현재 배경이 영상이면 재생
             */

            if (
                media &&
                media.tagName === "VIDEO"
            ) {

                try {

                    media.currentTime =
                        audio.currentTime;

                } catch (error) {}


                media.play()
                    .catch(
                        error => {

                            console.error(
                                "배경 재생 실패:",
                                error
                            );

                        }
                    );

            }


            /*
             * 배경 자체는 항상 표시
             */

            background.classList.add(
                "visible"
            );

            media.classList.add(
                "visible"
            );

        }

    }
);


/* ==========================================
   음악 일시정지
========================================== */

audio.addEventListener(
    "pause",
    () => {

        const song =
            songs[currentIndex];


        if (!song.background) {

            return;

        }


        const media =
            backgrounds[
                song.background
            ];


        if (
            media &&
            media.tagName === "VIDEO"
        ) {

            media.pause();

        }

    }
);


/* ==========================================
   음악 / 영상 싱크
========================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        const song =
            songs[currentIndex];


        if (!song.background) {

            return;

        }


        const media =
            backgrounds[
                song.background
            ];


        if (
            !media ||
            media.tagName !== "VIDEO"
        ) {

            return;

        }


        if (
            media.readyState < 2
        ) {

            return;

        }


        const difference =
            Math.abs(
                media.currentTime -
                audio.currentTime
            );


        if (
            difference > 0.35
        ) {

            try {

                media.currentTime =
                    audio.currentTime;

            } catch (error) {}

        }

    }
);


/* ==========================================
   음악 seek
========================================== */

audio.addEventListener(
    "seeking",
    () => {

        const song =
            songs[currentIndex];


        if (!song.background) {

            return;

        }


        const media =
            backgrounds[
                song.background
            ];


        if (
            !media ||
            media.tagName !== "VIDEO"
        ) {

            return;

        }


        try {

            media.currentTime =
                audio.currentTime;

        } catch (error) {}

    }
);


/* ==========================================
   음악 종료
========================================== */

audio.addEventListener(
    "ended",
    () => {

        const next =
            (
                currentIndex + 1
            ) % songs.length;


        loadSong(next);

    }
);


/* ==========================================
   NUMBER MP4 로딩
========================================== */

bgNumber.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background === "number"
        ) {

            if (
                !audio.paused
            ) {

                bgNumber.currentTime =
                    audio.currentTime;

                bgNumber.play()
                    .catch(() => {});

            }

        }

    }
);


/* ==========================================
   3번 MP4 로딩
========================================== */

bgVideo1.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background === "video1"
        ) {

            if (
                !audio.paused
            ) {

                bgVideo1.currentTime =
                    audio.currentTime;

                bgVideo1.play()
                    .catch(() => {});

            }

        }

    }
);


/* ==========================================
   4번 MP4 로딩
========================================== */

bgVideo2.addEventListener(
    "loadeddata",
    () => {

        if (
            songs[currentIndex].background === "video2"
        ) {

            if (
                !audio.paused
            ) {

                bgVideo2.currentTime =
                    audio.currentTime;

                bgVideo2.play()
                    .catch(() => {});

            }

        }

    }
);


/* ==========================================
   오류 확인
========================================== */

bgNumber.addEventListener(
    "error",
    () => {

        console.error(
            "NUMBER MP4 오류:",
            bgNumber.error
        );

    }
);


bgVideo1.addEventListener(
    "error",
    () => {

        console.error(
            "3번 MP4 오류:",
            bgVideo1.error
        );

    }
);


bgVideo2.addEventListener(
    "error",
    () => {

        console.error(
            "4번 MP4 오류:",
            bgVideo2.error
        );

    }
);


bgRelations.addEventListener(
    "error",
    () => {

        console.error(
            "relations JPG 오류"
        );

    }
);


/* ==========================================
   초기화
========================================== */

renderPlaylist();

loadSong(0);

</script>
