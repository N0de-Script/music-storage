<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N0DE SOUNDS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Arial,
        "Segoe UI",
        sans-serif;

    background: #10131a;
    color: white;

    min-height: 100vh;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* ==========================================
   배경 영상
========================================== */

#videoBackground {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 0;

    overflow: hidden;

    background: #10131a;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.5s ease,
        visibility 0.5s ease;

    pointer-events: none;
}

#videoBackground.show {

    opacity: 1;

    visibility: visible;
}

#backgroundVideo {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    filter: brightness(0.55);
}


/* ==========================================
   배경 어둡게
========================================== */

#videoOverlay {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 1;

    pointer-events: none;

    background:
        rgba(0, 0, 0, 0.25);
}


/* ==========================================
   플레이어
========================================== */

.player {

    position: relative;

    z-index: 10;

    width: calc(100% - 30px);

    max-width: 430px;

    padding: 28px;

    border-radius: 24px;

    background:
        rgba(20, 25, 35, 0.82);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    border:
        1px solid
        rgba(255, 255, 255, 0.15);

    box-shadow:
        0 25px 60px
        rgba(0, 0, 0, 0.6);
}


/* ==========================================
   앨범
========================================== */

.album {

    width: 100%;
    height: 180px;

    border-radius: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 60px;

    margin-bottom: 18px;

    background:
        rgba(255, 255, 255, 0.06);

    border:
        1px solid
        rgba(255, 255, 255, 0.1);
}


/* ==========================================
   제목
========================================== */

.title {

    text-align: center;

    font-size: 19px;

    font-weight: 700;

    line-height: 1.4;

    word-break: break-word;
}

.artist {

    text-align: center;

    margin-top: 5px;

    margin-bottom: 18px;

    color: #aeb8c7;

    font-size: 14px;
}


/* ==========================================
   오디오
========================================== */

audio {

    width: 100%;

    margin-bottom: 22px;
}


/* ==========================================
   Playlist
========================================== */

.playlist-title {

    font-size: 12px;

    color: #94a3b8;

    font-weight: 700;

    letter-spacing: 0.08em;

    margin-bottom: 10px;
}

.playlist {

    list-style: none;

    max-height: 210px;

    overflow-y: auto;

    border-radius: 14px;

    background:
        rgba(0, 0, 0, 0.2);
}

.song {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px 15px;

    cursor: pointer;

    border-bottom:
        1px solid
        rgba(255, 255, 255, 0.05);

    transition:
        background 0.2s ease;
}

.song:hover {

    background:
        rgba(255, 255, 255, 0.08);
}

.song.active {

    background:
        rgba(99, 102, 241, 0.35);
}

.number {

    width: 22px;

    min-width: 22px;

    text-align: center;

    color: #94a3b8;

    font-size: 12px;
}

.song-name {

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;
}


/* ==========================================
   모바일
========================================== */

@media (max-width: 500px) {

    .player {

        padding: 20px;
    }

    .album {

        height: 150px;

        font-size: 50px;
    }

}

</style>
</head>


<body>


<!-- ==========================================
     배경 영상
========================================== -->

<div id="videoBackground">

    <video
        id="backgroundVideo"
        muted
        loop
        playsinline
        preload="auto">

        <source
            src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20%282%29.mp4"
            type="video/mp4">

    </video>

</div>


<div id="videoOverlay"></div>


<!-- ==========================================
     플레이어
========================================== -->

<div class="player">

    <div class="album">
        🎧
    </div>


    <div
        class="title"
        id="songTitle">

        곡을 선택해주세요

    </div>


    <div
        class="artist"
        id="songArtist">

        N0DE SOUNDS

    </div>


    <audio
        id="audio"
        controls
        preload="metadata">
    </audio>


    <div class="playlist-title">
        PLAYLIST
    </div>


    <ul
        class="playlist"
        id="playlist">
    </ul>

</div>


<script>


/* ==========================================
   음악 데이터
========================================== */

const songs = [

    {
        title: "NUMBER TWERKNATION28",
        artist: "sped up / nightcore",

        file:
            "./NUMBER%20TWERKNATION28%20(sped%20upnightcore).mp3",

        background: false
    },


    {
        title: "BrooklynBloodPop!",
        artist: "Nightcore",

        file:
            "./Nightcore%20-%20BrooklynBloodPop!.mp3",

        background: false
    },


    {
        title: "i told u v1",
        artist: "midwxst",

        file:
            "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3",

        background: true
    },


    {
        title: "너",
        artist: "ycs",

        file:
            "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3",

        background: false
    },


    {
        title: "relations",
        artist: "이상형",

        file:
            "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3",

        background: false
    }

];


/* ==========================================
   요소
========================================== */

const audio =
    document.getElementById("audio");

const background =
    document.getElementById("videoBackground");

const backgroundVideo =
    document.getElementById("backgroundVideo");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playlist =
    document.getElementById("playlist");


let currentIndex = 0;


/* ==========================================
   Playlist 생성
========================================== */

function renderPlaylist() {

    playlist.innerHTML = "";

    songs.forEach(
        (song, index) => {

            const item =
                document.createElement("li");

            item.className = "song";


            if (
                index === currentIndex
            ) {

                item.classList.add("active");

            }


            item.innerHTML = `

                <span class="number">
                    ${index + 1}
                </span>

                <span class="song-name">
                    ${song.title}
                </span>

            `;


            item.addEventListener(
                "click",
                () => {

                    loadSong(index);

                }
            );


            playlist.appendChild(item);

        }
    );

}


/* ==========================================
   배경 표시
========================================== */

function showBackground() {

    background.classList.add("show");

}


/* ==========================================
   배경 숨기기
========================================== */

function hideBackground() {

    background.classList.remove("show");

    backgroundVideo.pause();

}


/* ==========================================
   배경 영상과 음악 싱크
========================================== */

function syncBackground() {

    if (
        backgroundVideo.readyState < 2
    ) {

        return;

    }


    const difference =
        Math.abs(
            backgroundVideo.currentTime -
            audio.currentTime
        );


    if (
        difference > 0.3
    ) {

        try {

            backgroundVideo.currentTime =
                audio.currentTime;

        } catch (error) {}

    }

}


/* ==========================================
   배경 영상 재생
========================================== */

function startBackground() {

    const song =
        songs[currentIndex];


    if (
        !song.background
    ) {

        hideBackground();

        return;

    }


    /*
     * 배경 표시
     */

    showBackground();


    /*
     * 음악과 영상 시작 위치 맞추기
     */

    try {

        if (
            backgroundVideo.readyState >= 1
        ) {

            backgroundVideo.currentTime =
                audio.currentTime;

        }

    } catch (error) {}


    /*
     * 영상 재생
     */

    backgroundVideo
        .play()
        .then(() => {

            console.log(
                "배경 영상 재생 성공"
            );

        })
        .catch(
            error => {

                console.error(
                    "배경 영상 재생 실패:",
                    error
                );

            }
        );

}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {

    if (
        index < 0 ||
        index >= songs.length
    ) {

        return;

    }


    currentIndex =
        index;


    const song =
        songs[currentIndex];


    /*
     * 기존 음악 정지
     */

    audio.pause();


    /*
     * 기존 배경 정지
     */

    backgroundVideo.pause();


    /*
     * 배경 처리
     */

    if (
        song.background
    ) {

        showBackground();

    } else {

        hideBackground();

        try {

            backgroundVideo.currentTime = 0;

        } catch (error) {}

    }


    /*
     * 음악 변경
     */

    audio.src =
        song.file;

    audio.load();


    /*
     * 곡 정보 변경
     */

    songTitle.textContent =
        song.title;

    songArtist.textContent =
        song.artist;


    /*
     * Playlist 갱신
     */

    renderPlaylist();


    /*
     * 사용자가 클릭한 곡이므로
     * 바로 재생
     */

    audio.play()
        .then(() => {

            if (
                song.background
            ) {

                startBackground();

            }

        })
        .catch(
            error => {

                console.error(
                    "음악 재생 실패:",
                    error
                );

            }
        );

}


/* ==========================================
   음악 재생
========================================== */

audio.addEventListener(
    "play",
    () => {

        const song =
            songs[currentIndex];


        if (
            song.background
        ) {

            startBackground();

        } else {

            hideBackground();

        }

    }
);


/* ==========================================
   음악 일시정지
========================================== */

audio.addEventListener(
    "pause",
    () => {

        backgroundVideo.pause();

    }
);


/* ==========================================
   음악 싱크
========================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        const song =
            songs[currentIndex];


        if (
            !song.background
        ) {

            return;

        }


        syncBackground();

    }
);


/* ==========================================
   음악 탐색
========================================== */

audio.addEventListener(
    "seeking",
    () => {

        const song =
            songs[currentIndex];


        if (
            !song.background
        ) {

            return;

        }


        try {

            backgroundVideo.currentTime =
                audio.currentTime;

        } catch (error) {}

    }
);


/* ==========================================
   음악 종료
========================================== */

audio.addEventListener(
    "ended",
    () => {

        const next =
            (
                currentIndex + 1
            ) % songs.length;


        loadSong(next);

    }
);


/* ==========================================
   영상 로딩 완료
========================================== */

backgroundVideo.addEventListener(
    "loadedmetadata",
    () => {

        console.log(
            "bg 영상 메타데이터 로딩 완료"
        );

    }
);


backgroundVideo.addEventListener(
    "loadeddata",
    () => {

        console.log(
            "bg 영상 데이터 로딩 완료"
        );


        const song =
            songs[currentIndex];


        if (
            song.background &&
            !audio.paused
        ) {

            startBackground();

        }

    }
);


/* ==========================================
   영상 재생 가능
========================================== */

backgroundVideo.addEventListener(
    "canplay",
    () => {

        console.log(
            "bg 영상 재생 가능"
        );


        const song =
            songs[currentIndex];


        if (
            song.background &&
            !audio.paused
        ) {

            startBackground();

        }

    }
);


/* ==========================================
   영상 오류
========================================== */

backgroundVideo.addEventListener(
    "error",
    () => {

        console.error(
            "배경 영상 로딩 실패"
        );

        console.error(
            "현재 영상 주소:",
            backgroundVideo.currentSrc
        );

        console.error(
            "오류:",
            backgroundVideo.error
        );

    }
);


/* ==========================================
   초기화
========================================== */

renderPlaylist();


currentIndex = 0;


audio.src =
    songs[0].file;


songTitle.textContent =
    songs[0].title;


songArtist.textContent =
    songs[0].artist;


audio.load();


renderPlaylist();


</script>

</body>
</html>
