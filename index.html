<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>N0DE SOUNDS</title>

<!-- Pretendard Web Font -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
}

/* 배경 RGB (12, 12, 12) 및 기본 텍스트 흰색 지정 */
body {
    background: rgb(12, 12, 12);
    color: #ffffff;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}


/* ==========================================
   배경 (Video / Image)
========================================== */

#videoBackground {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    background: rgb(12, 12, 12);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    pointer-events: none;
}

#videoBackground.show {
    opacity: 1;
    visibility: visible;
}

.background-video,
.background-image {
    position: absolute;
    top: -5%;
    left: -5%;
    width: 110%;
    height: 110%;
    object-fit: cover;
    display: block;
    filter: blur(8px) brightness(0.4) saturate(1.1);
    transform: scale(1.03);
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
}

.background-image {
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

.background-video.active,
.background-image.active {
    opacity: 1;
}

#videoOverlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(12, 12, 12, 0.2) 0%, rgb(12, 12, 12) 90%);
}


/* ==========================================
   Player Card
========================================== */

.player {
    position: relative;
    z-index: 10;
    width: calc(100% - 32px);
    max-width: 380px;
    padding: 32px 26px;
    border-radius: 24px;
    background: rgb(22, 22, 22);
    border: 1px solid rgb(35, 35, 35);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.brand-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: #ffffff;
    margin-bottom: 20px;
    text-transform: uppercase;
}


/* ==========================================
   Track Info (모든 텍스트 흰색)
========================================== */

.track-info {
    text-align: center;
    width: 100%;
    margin-bottom: 24px;
}

.title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist {
    font-size: 14px;
    color: #ffffff;
    font-weight: 500;
}


/* ==========================================
   Progress Bar
========================================== */

.progress-section {
    width: 100%;
    margin-bottom: 24px;
}

.progress-bar-container {
    width: 100%;
    height: 6px;
    background: rgb(35, 35, 35);
    border-radius: 8px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #ffffff;
    border-radius: 8px;
    transition: width 0.1s linear;
}

.time-display {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #ffffff;
    margin-top: 8px;
    font-weight: 600;
}


/* ==========================================
   Controls (버튼 RGB 16, 16, 16)
========================================== */

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
    width: 100%;
}

.ctrl-btn {
    background: rgb(16, 16, 16);
    border: 1px solid rgb(35, 35, 35);
    color: #ffffff;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.ctrl-btn:hover {
    background: rgb(28, 28, 28);
    border-color: rgb(50, 50, 50);
}

.ctrl-btn:active {
    transform: scale(0.92);
}

.ctrl-btn.side-btn {
    width: 46px;
    height: 46px;
}

.ctrl-btn.play-btn {
    width: 60px;
    height: 60px;
    background: rgb(16, 16, 16);
    border: 1px solid rgb(45, 45, 45);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
}

.ctrl-btn.play-btn:hover {
    background: rgb(28, 28, 28);
}

.ctrl-btn svg {
    fill: #ffffff;
}


/* ==========================================
   Playlist (모든 텍스트 흰색)
========================================== */

.playlist-container {
    width: 100%;
}

.playlist-title {
    font-size: 11px;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
    padding-left: 2px;
}

.playlist {
    list-style: none;
    max-height: 180px;
    overflow-y: auto;
    border-radius: 14px;
    background: rgb(16, 16, 16);
    border: 1px solid rgb(30, 30, 30);
    padding: 6px;
}

.playlist::-webkit-scrollbar {
    width: 4px;
}
.playlist::-webkit-scrollbar-thumb {
    background: rgb(40, 40, 40);
    border-radius: 8px;
}

.song {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    cursor: pointer;
    border-radius: 10px;
    margin-bottom: 3px;
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.2s ease;
}

.song:hover {
    background: rgb(28, 28, 28);
}

.song.active {
    background: rgb(28, 28, 28);
    border: 1px solid rgb(60, 60, 60);
}

.song.active .number {
    color: #ffffff;
    font-weight: 700;
}

.song.active .song-name {
    color: #ffffff;
    font-weight: 600;
}

.number {
    width: 18px;
    text-align: center;
    color: #ffffff;
    font-size: 12px;
}

.song-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13.5px;
    color: #ffffff;
}

</style>
</head>


<body>

<!-- 배경 이미지/동영상 -->
<div id="videoBackground">
    <div id="backgroundImage1" class="background-image"></div>
    <video id="backgroundVideo1" class="background-video" muted loop playsinline preload="auto" src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_midwxst-i-told-u-v1-unofficial-video_Media_tAw4egw347o_001_1080p%20(2).mp4"></video>
    <video id="backgroundVideo2" class="background-video" muted loop playsinline preload="auto" src="https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/YTDown.com_YouTube_Media_TiOpGgCXeT0_001_480p%20(1).mp4"></video>
    <div id="backgroundImage2" class="background-image"></div>
</div>

<div id="videoOverlay"></div>


<!-- Solid Modern Player Card -->
<div class="player">

    <div class="brand-tag">N0DE SOUNDS</div>

    <!-- Track Info -->
    <div class="track-info">
        <div class="title" id="songTitle">곡을 선택해주세요</div>
        <div class="artist" id="songArtist">N0DE SOUNDS</div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="durationTime">0:00</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="ctrl-btn side-btn" id="prevBtn" title="이전 곡">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playPauseBtn" title="재생/일시정지">
            <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn side-btn" id="nextBtn" title="다음 곡">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>

    <!-- 숨겨진 오디오 태그 -->
    <audio id="audio" preload="metadata"></audio>

    <!-- Playlist -->
    <div class="playlist-container">
        <div class="playlist-title">PLAYLIST</div>
        <ul class="playlist" id="playlist"></ul>
    </div>

</div>


<script>

const audio = document.getElementById("audio");
const background = document.getElementById("videoBackground");
const backgroundVideo1 = document.getElementById("backgroundVideo1");
const backgroundVideo2 = document.getElementById("backgroundVideo2");
const backgroundImage1 = document.getElementById("backgroundImage1");
const backgroundImage2 = document.getElementById("backgroundImage2");

const songTitle = document.getElementById("songTitle");
const songArtist = document.getElementById("songArtist");
const playlist = document.getElementById("playlist");

const playPauseBtn = document.getElementById("playPauseBtn");
const playIcon = document.getElementById("playIcon");
const pauseIcon = document.getElementById("pauseIcon");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const progressBarContainer = document.getElementById("progressBarContainer");
const progressFill = document.getElementById("progressFill");
const currentTimeEl = document.getElementById("currentTime");
const durationTimeEl = document.getElementById("durationTime");

let currentIndex = 0;


/* ==========================================
   배경 이미지 로드
========================================== */

backgroundImage1.style.backgroundImage = "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/85a074861f51fc3a560a6077e1162bbb.gif')";
backgroundImage2.style.backgroundImage = "url('https://raw.githubusercontent.com/N0de-Script/mp4-storage/main/40d89af3f71dddcdca7065a07fc6e069.jpg')";


/* ==========================================
   음악 데이터 (Syko 변경 유지)
========================================== */

const songs = [
    { title: "BrooklynBloodPop!", artist: "Syko", file: "./Nightcore%20-%20BrooklynBloodPop!.mp3", background: "image1" },
    { title: "i told u v1", artist: "midwxst", file: "./midwxst%20-%20i%20told%20u%20v1%20%5Bunofficial%20video%5D.mp3", background: "video1" },
    { title: "너", artist: "ycs", file: "./ycs%20-%20%EB%84%88%20(Official%20Audio).mp3", background: "video2" },
    { title: "relations", artist: "이상형", file: "./%EC%9D%B4%EC%83%81%ED%98%95%20-%20relations%20%5BOfficial%20Music%20Video%5D.mp3", background: "image2" }
];


/* ==========================================
   배경 제어
========================================== */

function hideAllBackgrounds() {
    backgroundVideo1.pause();
    backgroundVideo2.pause();
    backgroundVideo1.classList.remove("active");
    backgroundVideo2.classList.remove("active");
    backgroundImage1.classList.remove("active");
    backgroundImage2.classList.remove("active");
    background.classList.remove("show");
}

function getBackgroundElement() {
    const song = songs[currentIndex];
    if (song.background === "video1") return backgroundVideo1;
    if (song.background === "video2") return backgroundVideo2;
    if (song.background === "image1") return backgroundImage1;
    if (song.background === "image2") return backgroundImage2;
    return null;
}

function startBackground() {
    const el = getBackgroundElement();
    if (!el) {
        hideAllBackgrounds();
        return;
    }

    const isVideo = (el === backgroundVideo1 || el === backgroundVideo2);

    if (el !== backgroundVideo1) { backgroundVideo1.pause(); backgroundVideo1.classList.remove("active"); }
    if (el !== backgroundVideo2) { backgroundVideo2.pause(); backgroundVideo2.classList.remove("active"); }
    if (el !== backgroundImage1) backgroundImage1.classList.remove("active");
    if (el !== backgroundImage2) backgroundImage2.classList.remove("active");

    background.classList.add("show");
    el.classList.add("active");

    if (isVideo) {
        if (el.readyState >= 1) {
            try { el.currentTime = audio.currentTime; } catch (e) {}
        }
        el.play().catch(e => console.error("배경 영상 재생 실패:", e));
    }
}


/* ==========================================
   시간 포맷
========================================== */

function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}


/* ==========================================
   Playlist 렌더링
========================================== */

function renderPlaylist() {
    playlist.innerHTML = "";
    songs.forEach((song, index) => {
        const item = document.createElement("li");
        item.className = "song";
        if (index === currentIndex) item.classList.add("active");

        item.innerHTML = `
            <span class="number">${index + 1}</span>
            <span class="song-name">${song.title}</span>
        `;

        item.addEventListener("click", () => loadSong(index));
        playlist.appendChild(item);
    });
}


/* ==========================================
   곡 변경
========================================== */

function loadSong(index) {
    currentIndex = index;
    const song = songs[currentIndex];

    audio.pause();
    hideAllBackgrounds();

    audio.src = song.file;
    audio.load();

    songTitle.textContent = song.title;
    songArtist.textContent = song.artist;

    renderPlaylist();

    audio.play()
        .then(() => {
            if (song.background !== null) startBackground();
        })
        .catch(e => console.error("음악 재생 실패:", e));
}


/* ==========================================
   컨트롤 버튼 이벤트
========================================== */

playPauseBtn.addEventListener("click", () => {
    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
});

prevBtn.addEventListener("click", () => {
    const prev = (currentIndex - 1 + songs.length) % songs.length;
    loadSong(prev);
});

nextBtn.addEventListener("click", () => {
    const next = (currentIndex + 1) % songs.length;
    loadSong(next);
});


/* ==========================================
   프로그레스 바 클릭/시크
========================================== */

progressBarContainer.addEventListener("click", (e) => {
    const width = progressBarContainer.clientWidth;
    const clickX = e.offsetX;
    const duration = audio.duration;

    if (duration) {
        audio.currentTime = (clickX / width) * duration;
    }
});


/* ==========================================
   오디오 이벤트
========================================== */

audio.addEventListener("play", () => {
    playIcon.style.display = "none";
    pauseIcon.style.display = "block";

    const song = songs[currentIndex];
    if (song.background !== null) {
        startBackground();
    } else {
        hideAllBackgrounds();
    }
});

audio.addEventListener("pause", () => {
    playIcon.style.display = "block";
    pauseIcon.style.display = "none";

    const el = getBackgroundElement();
    if (el === backgroundVideo1 || el === backgroundVideo2) {
        el.pause();
    }
});

audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${progressPercent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
    }

    const el = getBackgroundElement();
    if (el !== backgroundVideo1 && el !== backgroundVideo2) return;
    if (el.readyState < 2) return;

    const diff = Math.abs(el.currentTime - audio.currentTime);
    if (diff > 0.35) {
        try { el.currentTime = audio.currentTime; } catch (e) {}
    }
});

audio.addEventListener("seeking", () => {
    const el = getBackgroundElement();
    if (el !== backgroundVideo1 && el !== backgroundVideo2) return;
    try { el.currentTime = audio.currentTime; } catch (e) {}
});

audio.addEventListener("ended", () => {
    const next = (currentIndex + 1) % songs.length;
    loadSong(next);
});


/* ==========================================
   비디오 로딩 / 에러 핸들러
========================================== */

backgroundVideo1.addEventListener("loadeddata", () => {
    if (songs[currentIndex].background === "video1" && !audio.paused) startBackground();
});

backgroundVideo2.addEventListener("loadeddata", () => {
    if (songs[currentIndex].background === "video2" && !audio.paused) startBackground();
});

backgroundVideo1.addEventListener("error", () => console.error("배경 영상1 로딩 실패:", backgroundVideo1.error));
backgroundVideo2.addEventListener("error", () => console.error("배경 영상2 로딩 실패:", backgroundVideo2.error));


/* ==========================================
   초기화
========================================== */

renderPlaylist();
loadSong(0);

</script>

</body>
</html>
